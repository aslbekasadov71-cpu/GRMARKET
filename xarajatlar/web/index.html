<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<meta name="robots" content="noindex">
<title>Xarajatlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#101828;--mute:#8a94a6;--line:#e6e9ef;--b:#2b6cf6;--bl:#e8f0ff;--red:#f04438;--redl:#fee4e2;--ok:#12b76a;--okl:#dcfae6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{font:500 16px/1.4 Manrope,-apple-system,system-ui,sans-serif;color:var(--ink);padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding:10px 14px calc(190px + env(safe-area-inset-bottom))}
iconify-icon{display:inline-block;vertical-align:middle;flex:none}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:14px;font-weight:700;margin:20px 0 8px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px}
.pill{background:var(--bl);color:var(--b);font-weight:700;font-size:13px;padding:8px 12px;border-radius:99px;display:flex;align-items:center;gap:6px;border:0;font-family:inherit;cursor:pointer}
input{font:inherit;color:inherit;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;outline:0}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
.field:focus-within{border-color:var(--b)}
.field input{border:0;background:none;padding:14px 0;margin:0;min-width:0}
.field iconify-icon{color:var(--b)}
.btn{font:inherit;font-weight:700;border-radius:14px;padding:14px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.b{background:var(--b);color:#fff;border-color:var(--b)}.btn:disabled{opacity:.45}
.btn.red{background:var(--redl);color:var(--red);border-color:var(--redl)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--b);font:inherit;font-weight:700;padding:10px;cursor:pointer;width:100%;text-align:center}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.card{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;width:100%;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.card:active{transform:scale(.99)}
.card>.grow{flex:1;min-width:0}
.card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:44px;height:44px;border-radius:13px;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none}
.right{text-align:right;flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block;margin-right:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-weight:700;font-size:14px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--bl);color:var(--b);border-color:var(--bl)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.stat{background:linear-gradient(135deg,#2b6cf6 0%,#5b93ff 100%);color:#fff;border-radius:22px;padding:18px;margin-bottom:10px;position:relative;overflow:hidden}
.stat:before,.stat:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.stat:before{right:-50px;top:-60px;width:180px;height:180px}.stat:after{right:40px;bottom:-70px;width:120px;height:120px}
.stat small{color:rgba(255,255,255,.8)}
.stat .big{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stat .sp{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.stat .sp div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:9px 11px;min-width:0}
.stat .sp b{font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .sp small{font-size:12px;display:flex;align-items:center;gap:4px}
.dtiles{display:flex;gap:8px;margin-bottom:10px}
.dtile{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;min-width:0}
.dtile small{display:flex;align-items:center;gap:5px}
.dtile b{display:block;font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dtile.in b{color:#16a34a}.dtile.out b{color:var(--red)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:700;border:0;background:none;color:var(--mute);padding:10px 4px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--b);color:#fff}.seg.out button.on{background:var(--red)}.seg.in button.on{background:var(--ok)}
.panel{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.bars{display:flex;gap:3px;height:140px;align-items:flex-end}
.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bars .pair{display:flex;gap:2px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.bars i{flex:1;max-width:14px;background:var(--red);border-radius:5px 5px 2px 2px;min-height:3px}
.bars i.s{background:var(--ok)}.bars i.z{background:var(--line)}
.bars small{font-size:10px;font-weight:700}
.legend{display:flex;gap:14px;margin-top:10px;font-size:13px;font-weight:700;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;align-items:center;gap:14px}
.donut svg{flex:none}
.donut .lg{flex:1;min-width:0}
.donut .lg div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 0}
.donut .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.donut .lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:6px;border-radius:99px;background:var(--bg);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--b);border-radius:99px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.empty iconify-icon{color:var(--b);opacity:.7;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--b)}
.slab{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 12px 12px;z-index:4;box-shadow:0 -8px 24px rgba(16,24,40,.08)}
.hint{font-size:13px;color:var(--mute);font-weight:600;margin:0 4px 8px;min-height:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hint b{color:var(--ink)}
.cbox{display:flex;gap:8px;align-items:center}
.cbox form{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:16px;padding:4px 4px 4px 14px;min-width:0;border:1px solid transparent}
.cbox form:focus-within{border-color:var(--b);background:var(--card)}
.cbox input{border:0;background:none;padding:10px 0;margin:0;min-width:0;font-size:16px}
.rb{width:40px;height:40px;border-radius:12px;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--b);color:#fff}
.rb.ghost{background:var(--bl);color:var(--b);width:48px;height:48px;border-radius:15px}
.mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--b);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer;transition:transform .15s,background .15s}
.mic.rec{background:var(--red);transform:scale(1.08);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(240,68,56,.22)}50%{box-shadow:0 0 0 14px rgba(240,68,56,.06)}}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-end;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.x{background:var(--card);border:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--mute);flex:none}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:10px 16px;border-radius:99px;z-index:20;display:none;align-items:center;gap:6px;max-width:92%;font-size:14px}
.login{padding-top:12vh;text-align:center}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#2b6cf6,#5b93ff);color:#fff;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 10px 30px rgba(43,108,246,.3)}
.login h1{font-size:34px;margin-bottom:8px}
.hist{background:var(--card);border-radius:18px;padding:4px 14px;margin-bottom:10px}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .grow{flex:1;min-width:0}
.hrow button{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px;display:grid}
.big2{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.green{color:#16a34a}.redt{color:var(--red)}
@media(min-width:900px){#app{max-width:720px}.slab{max-width:720px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const API = "https://gaincffqsfpezjnxwvwc.supabase.co/functions/v1/xarajat/api";
const ic = (n, s = 22) => `<iconify-icon icon="solar:${n}" width="${s}" height="${s}"></iconify-icon>`;
// [ikonka, nom, rang]
const CATS = {
  dokon:{firma:["delivery-bold-duotone","Firmaga to'lov","#2b6cf6"],tovar:["box-bold-duotone","Tovar xaridi","#7a5af8"],svet:["bolt-bold-duotone","Svet","#f79009"],gaz:["fire-bold-duotone","Gaz","#fb6514"],soliq:["bill-list-bold-duotone","Soliq","#667085"],ijara:["home-2-bold-duotone","Ijara","#06aed4"],oylik:["users-group-rounded-bold-duotone","Ish haqi","#ee46bc"],boshqa:["widget-4-bold-duotone","Boshqa","#84a3c4"]},
  shaxsiy:{oziq:["cart-large-2-bold-duotone","Oziq-ovqat","#12b76a"],transport:["bus-bold-duotone","Transport","#f79009"],uy:["home-smile-bold-duotone","Uy-ro'zg'or","#06aed4"],kommunal:["lightbulb-bold-duotone","Kommunal","#eaaa08"],aloqa:["smartphone-bold-duotone","Telefon/internet","#2b6cf6"],kiyim:["t-shirt-bold-duotone","Kiyim","#ee46bc"],soglik:["health-bold-duotone","Sog'liq","#f04438"],talim:["book-bold-duotone","Ta'lim","#7a5af8"],dam:["gift-bold-duotone","Dam olish","#fb6514"],boshqa:["widget-4-bold-duotone","Boshqa","#84a3c4"]}
};
const SAVDO = ["wallet-money-bold-duotone","Kunlik savdo","#12b76a"];
const MON = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const som = n => fmt(n) + " so'm";
const short = n => Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(Math.abs(n) % 1e6 ? 1 : 0) + " mln" : Math.abs(n) >= 1e3 ? Math.round(n / 1e3) + "k" : String(Math.round(n));
const digits = v => Math.round(+String(v ?? "").replace(/[^\d]/g, "") || 0);
const iso = d => d.toLocaleDateString("sv-SE");
const today = () => iso(new Date());
const dAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const mStart = (k = 0) => { const d = new Date(); return iso(new Date(d.getFullYear(), d.getMonth() + k, 1)); };
const mEnd = (k = 0) => { const d = new Date(); return iso(new Date(d.getFullYear(), d.getMonth() + k + 1, 0)); };
const dLabel = d => d === today() ? "Bugun" : d === dAgo(1) ? "Kecha" : (() => { const x = new Date(d + "T00:00:00"); return x.getDate() + "-" + MON[x.getMonth()]; })();
const hhmm = ts => { const d = new Date(ts); return isNaN(d) ? "" : String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const cat = (s, c) => c === "savdo" ? SAVDO : CATS[s]?.[c] || ["widget-4-bold-duotone", c, "#84a3c4"];
const isS = r => r.kind === "savdo";
const sum = rs => rs.reduce((a, r) => a + +r.amount, 0);
const tint = c => c + "1f";
const pkey = s => String(s || "").trim().toLowerCase().replace(/[ʻʼ‘’`´]/g, "'").replace(/\s+/g, " ");
const AVC = ["#2b6cf6","#12b76a","#f79009","#7a5af8","#ee46bc","#06aed4","#fb6514","#667085"];
const avc = s => AVC[[...pkey(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length];
const ini = s => String(s || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();

const tgw = window.Telegram?.WebApp;
try{ tgw?.ready(); tgw?.expand(); tgw?.setHeaderColor?.("#f2f4f7"); tgw?.setBackgroundColor?.("#f2f4f7"); }catch(e){}

let T = "", ROWS = [], DEBTS = [], tab = "home", per = "today", scope = "all", dtab = "in", dq = "", busy = false, edit = null, dform = null, PL = [];
try{ T = localStorage.getItem("xr_t") || ""; }catch(e){}
const hm = location.hash.match(/t=([\w-]{20,})/);
if(hm){ T = hm[1]; try{ localStorage.setItem("xr_t", T); }catch(e){} history.replaceState(null, "", location.pathname); }
try{ tab = localStorage.getItem("xr_tab") || "home"; }catch(e){}

async function api(action, body = {}){
  const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({t:T, action, ...body})});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401){ logout(); throw new Error("Kirish muddati tugagan"); }
  if(!r.ok) throw new Error(j.error || "Xatolik");
  return j;
}
function logout(){ T = ""; try{ localStorage.removeItem("xr_t"); }catch(e){} loginView(); }
let tT;
function toast(msg, icon = "check-circle-bold"){
  const t = $("#toast"); t.innerHTML = ic(icon, 18) + `<span>${msg}</span>`; t.style.display = "flex";
  clearTimeout(tT); tT = setTimeout(() => t.style.display = "none", 2600);
}
function loginView(){
  $(".slab")?.remove(); $("nav")?.remove();
  $("#app").innerHTML = `<div class="login"><div class="logo">${ic("wallet-money-bold-duotone", 38)}</div><h1>Xarajatlar</h1>
  <p style="color:var(--mute);margin-bottom:22px">Kirish uchun Telegram botda<br><b style="color:var(--ink)">📱 Ilovani ochish</b> tugmasini bosing</p>
  <a class="btn b" style="display:inline-flex;text-decoration:none" href="https://t.me/menku_bubot">${ic("plain-2-bold", 20)} Botni ochish</a></div>`;
}

/* ---------- davr ---------- */
const PER = [["today","Bugun"],["yday","Kecha"],["week","7 kun"],["month","Shu oy"],["prev","O'tgan oy"]];
function range(){
  if(per === "today") return [today(), today()];
  if(per === "yday") return [dAgo(1), dAgo(1)];
  if(per === "week") return [dAgo(6), today()];
  if(per === "month") return [mStart(), today()];
  return [mStart(-1), mEnd(-1)];
}
const inDates = r => { const [a, b] = range(); return r.spent_on >= a && r.spent_on <= b; };
const inRange = r => inDates(r) && (scope === "all" || isS(r) || r.scope === scope);

async function load(){
  try{
    const j = await api("list", {from: mStart(-1) < dAgo(62) ? mStart(-1) : dAgo(62)});
    ROWS = j.rows || []; DEBTS = j.debts || []; draw();
  }catch(e){ if(T && $("#body")) $("#body").innerHTML = `<div class="empty">${ic("danger-triangle-bold-duotone", 42)}<br>${esc(e.message)}</div>`; }
}

function shell(){
  $("#app").innerHTML = `<div id="body"><div class="empty"><span class="spin"></span></div></div>`;
  if(!$(".slab")){
    const s = document.createElement("div"); s.className = "slab";
    s.innerHTML = `<div class="hint" id="hint">Yozing yoki ayting: <b>«svetga 250 ming»</b>, <b>«savdo 3 mln»</b>, <b>«Ali 50 ming nasiya oldi»</b></div>
    <div class="cbox"><button class="rb ghost" onclick="tab==='debts'?openDebtForm():openForm()" aria-label="Qo'lda qo'shish">${ic("add-circle-bold", 26)}</button>
      <form onsubmit="event.preventDefault();sendText()"><input id="tx" placeholder="Xarajat, savdo yoki qarz..." autocomplete="off" enterkeyhint="send">
      <button class="rb" type="submit" aria-label="Yuborish">${ic("plain-2-bold", 20)}</button></form>
      <button class="mic" id="mic" onclick="toggleRec()" aria-label="Ovoz">${ic("microphone-3-bold", 26)}</button></div>`;
    document.body.appendChild(s);
    document.body.appendChild(document.createElement("nav"));
  }
}
function drawNav(){
  const N = [["home","chart-2-bold-duotone","Asosiy"],["list","document-text-bold-duotone","Ro'yxat"],["debts","notebook-bold-duotone","Qarzlar"]];
  $("nav").innerHTML = N.map(([k, i, l]) => `<button class="${tab===k?"on":""}" onclick="go('${k}')">${ic(i, 26)}${l}</button>`).join("");
}
function go(k){ tab = k; try{ localStorage.setItem("xr_tab", k); }catch(e){} draw(); scrollTo(0, 0); }

function header(title, sub){
  return `<div class="top"><div><small>${sub}</small><h1>${title}</h1></div>
    <button class="pill" onclick="load().then(()=>toast('Yangilandi'))">${ic("refresh-bold", 16)} Yangilash</button></div>`;
}
function perChips(){ return `<div class="chips">${PER.map(([k, l]) => `<button class="chip ${per===k?"on":""}" onclick="per='${k}';draw()">${l}</button>`).join("")}</div>`; }
function scopeSeg(){ return `<div class="seg">${[["all","Hammasi","widget-bold"],["dokon","Do'kon","shop-bold"],["shaxsiy","Shaxsiy","user-rounded-bold"]].map(([k, l, i]) => `<button class="${scope===k?"on":""}" onclick="scope='${k}';draw()">${ic(i, 18)}${l}</button>`).join("")}</div>`; }

function draw(){
  if(!$("#body")) return;
  drawNav();
  if(tab === "debts") return drawDebts();
  if(tab === "list") return drawList();
  drawHome();
}

/* ---------- Asosiy ---------- */
function drawHome(){
  const all = ROWS.filter(inRange), rs = all.filter(r => !isS(r)), tot = sum(rs);
  const sv = scope === "shaxsiy" ? 0 : sum(ROWS.filter(inDates).filter(isS)), left = sv - tot;

function drawForm(){
  const e = edit, firms = [...new Set(ROWS.map(r => r.firm).filter(Boolean))];
  modal(`<div class="mh"><h1 style="font-size:22px">${e.id ? "Tahrirlash" : "Yangi yozuv"}</h1><button class="x" onclick="closeModal()">${ic("close-circle-linear", 22)}</button></div>
  <div class="seg ${e.kind === "savdo" ? "in" : "out"}">${[["xarajat","Xarajat","arrow-up-right-bold"],["savdo","Savdo","arrow-down-left-bold"]].map(([k, l, i]) => `<button class="${e.kind===k?"on":""}" onclick="edit.kind='${k}';drawForm()">${ic(i, 18)}${l}</button>`).join("")}</div>
  ${e.kind === "savdo" ? "" : `<div class="seg">${[["dokon","Do'kon","shop-bold"],["shaxsiy","Shaxsiy","user-rounded-bold"]].map(([k, l, i]) => `<button class="${e.scope===k?"on":""}" onclick="edit.scope='${k}';if(!CATS['${k}'][edit.cat])edit.cat='boshqa';drawForm()">${ic(i, 18)}${l}</button>`).join("")}</div>
  <div class="chips wrap">${Object.entries(CATS[e.scope]).map(([k, [i, l, c]]) => `<button class="chip ${e.cat===k?"on":""}" onclick="edit.cat='${k}';drawForm()"><span style="color:${c};display:grid">${ic(i, 18)}</span>${l}</button>`).join("")}</div>`}
  ${e.kind !== "savdo" && e.scope === "dokon" && e.cat === "firma" ? `<label class="field">${ic("delivery-bold-duotone", 22)}<input list="fl" placeholder="Firma nomi" value="${esc(e.firm)}" oninput="edit.firm=this.value" autocomplete="off"></label><datalist id="fl">${firms.map(f => `<option value="${esc(f)}">`).join("")}</datalist>` : ""}
  <label class="field">${ic("wallet-money-bold-duotone", 22)}<input inputmode="numeric" id="ea" placeholder="Summa" value="${e.amount ? fmt(e.amount) : ""}" oninput="edit.amount=digits(this.value);this.value=edit.amount?fmt(edit.amount):''"></label>
  <label class="field">${ic("calendar-bold-duotone", 22)}<input type="date" value="${e.date}" max="${today()}" onchange="edit.date=this.value||today()"></label>
  <label class="field">${ic("pen-2-bold-duotone", 22)}<input value="${esc(e.note)}" oninput="edit.note=this.value" placeholder="Izoh (ixtiyoriy)"></label>
  <div class="row" style="margin-top:4px">${e.id ? `<button class="btn red" onclick="delItem()">${ic("trash-bin-trash-bold", 20)} O'chirish</button>` : ""}<button class="btn b" id="esave" onclick="saveForm()">${ic("check-circle-bold", 20)} Saqlash</button></div>`);
}
async function saveForm(){
  const e = edit; if(!(e.amount > 0)) return toast("Summani kiriting", "danger-triangle-bold");
  if(e.kind !== "savdo" && e.scope === "dokon" && e.cat === "firma" && !e.firm.trim()) return toast("Firma nomini kiriting", "danger-triangle-bold");
  const b = $("#esave"); b.disabled = true;
  try{
    const body = {kind:e.kind, scope:e.scope, cat:e.kind === "savdo" ? "savdo" : e.cat, amount:e.amount, firm:e.firm, note:e.note, date:e.date};
    if(e.id){ const j = await api("update", {id:e.id, ...body}); ROWS = ROWS.map(r => r.id === e.id ? j.row : r); toast("Saqlandi"); closeModal(); draw(); }
    else { const j = await api("add", body); closeModal(); afterSave(j); toast("Qo'shildi"); }
  }catch(err){ b.disabled = false; toast(esc(err.message), "danger-triangle-bold"); }
}
async function delItem(){
  if(!confirm("Bu yozuv o'chirilsinmi?")) return;
  try{ await api("del", {id:edit.id}); ROWS = ROWS.filter(r => r.id !== edit.id); closeModal(); draw(); toast("O'chirildi"); }
  catch(e){ toast(esc(e.message), "danger-triangle-bold"); }
}

if(T){ shell(); drawNav(); load(); } else loginView();
</script>
</body>
</html>
