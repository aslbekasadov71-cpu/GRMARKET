<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<meta name="robots" content="noindex">
<title>Xarajatlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#101828;--mute:#8a94a6;--line:#e6e9ef;--b:#2b6cf6;--bl:#e8f0ff;--red:#f04438;--redl:#fee4e2;--ok:#12b76a;--okl:#dcfae6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{font:500 16px/1.4 Manrope,-apple-system,system-ui,sans-serif;color:var(--ink);padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding:10px 14px calc(190px + env(safe-area-inset-bottom))}
iconify-icon{display:inline-block;vertical-align:middle;flex:none}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:14px;font-weight:700;margin:20px 0 8px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px}
.pill{background:var(--bl);color:var(--b);font-weight:700;font-size:13px;padding:8px 12px;border-radius:99px;display:flex;align-items:center;gap:6px;border:0;font-family:inherit;cursor:pointer}
input{font:inherit;color:inherit;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;outline:0}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
.field:focus-within{border-color:var(--b)}
.field input{border:0;background:none;padding:14px 0;margin:0;min-width:0}
.field iconify-icon{color:var(--b)}
.btn{font:inherit;font-weight:700;border-radius:14px;padding:14px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.b{background:var(--b);color:#fff;border-color:var(--b)}.btn:disabled{opacity:.45}
.btn.red{background:var(--redl);color:var(--red);border-color:var(--redl)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--b);font:inherit;font-weight:700;padding:10px;cursor:pointer;width:100%;text-align:center}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.card{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;width:100%;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.card:active{transform:scale(.99)}
.card>.grow{flex:1;min-width:0}
.card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:44px;height:44px;border-radius:13px;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none}
.right{text-align:right;flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block;margin-right:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-weight:700;font-size:14px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--bl);color:var(--b);border-color:var(--bl)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.stat{background:linear-gradient(135deg,#2b6cf6 0%,#5b93ff 100%);color:#fff;border-radius:22px;padding:18px;margin-bottom:10px;position:relative;overflow:hidden}
.stat:before,.stat:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.stat:before{right:-50px;top:-60px;width:180px;height:180px}.stat:after{right:40px;bottom:-70px;width:120px;height:120px}
.stat small{color:rgba(255,255,255,.8)}
.stat .big{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stat .sp{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.stat .sp div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:9px 11px;min-width:0}
.stat .sp b{font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .sp small{font-size:12px;display:flex;align-items:center;gap:4px}
.dtiles{display:flex;gap:8px;margin-bottom:10px}
.dtile{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;min-width:0}
.dtile small{display:flex;align-items:center;gap:5px}
.dtile b{display:block;font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dtile.in b{color:#16a34a}.dtile.out b{color:var(--red)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;font:inherit;font-size:13.5px;font-weight:700;border:0;background:none;color:var(--mute);padding:10px 4px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--b);color:#fff}.seg.out button.on{background:var(--red)}.seg.in button.on{background:var(--ok)}
.panel{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.bars{display:flex;gap:3px;height:140px;align-items:flex-end}
.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bars .pair{display:flex;gap:2px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.bars i{flex:1;max-width:14px;background:var(--red);border-radius:5px 5px 2px 2px;min-height:3px}
.bars i.s{background:var(--ok)}.bars i.z{background:var(--line)}
.bars small{font-size:10px;font-weight:700}
.bscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;margin:0 -6px;padding:0 6px}
.bscroll::-webkit-scrollbar{display:none}
.bars2{display:flex;gap:4px;height:150px;align-items:stretch;min-width:100%}
.bcol{flex:1 0 34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;background:none;border:0;padding:6px 0 4px;border-radius:10px;cursor:pointer;scroll-snap-align:end;font:inherit;transition:background .15s}
.bcol.on{background:var(--bl)}
.bcol .pair{display:flex;gap:2px;align-items:flex-end;justify-content:center;width:100%;flex:1}
.bcol i{width:11px;background:var(--red);border-radius:5px 5px 2px 2px;min-height:3px;transition:height .35s ease}
.bcol i.s{background:var(--ok)}.bcol i.z{background:var(--line)}
.bcol small{font-size:11px;font-weight:700;color:var(--mute);line-height:1}.bcol.on small{color:var(--b)}
.bcol em{font-style:normal;font-size:9px;font-weight:700;color:var(--mute);line-height:1;min-height:9px}
.binfo{display:flex;gap:6px;margin-bottom:10px}
.binfo div{flex:1;background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
.binfo small{font-size:11px}.binfo b{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;display:block;overflow:hidden;text-overflow:ellipsis}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800;font-size:15px}
.bhead small{font-weight:600}
.stiles{display:flex;gap:8px;margin-bottom:10px}
.stile{flex:1;background:var(--card);border:2px solid transparent;border-radius:16px;padding:10px 11px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.stile.on{border-color:currentColor}
.stile small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
.stile b{display:block;font-size:15px;font-weight:800;margin-top:3px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stile .pbar{height:5px;margin-top:6px}
.dsel{text-align:center;font-size:13px;font-weight:700;color:var(--mute);margin-top:8px;min-height:18px}
.dsel b{color:var(--ink)}
.legend{display:flex;gap:14px;margin-top:10px;font-size:13px;font-weight:700;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;align-items:center;gap:14px}
.donut svg{flex:none}
.donut .lg{flex:1;min-width:0}
.donut .lg button{display:flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:700;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px);background:none;border:0;border-radius:8px;cursor:pointer;color:inherit;text-align:left}
.donut .lg button.on{background:var(--bg)}
.donut circle{cursor:pointer;transition:opacity .2s,stroke-width .2s}
.donut .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.donut .lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:6px;border-radius:99px;background:var(--bg);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--b);border-radius:99px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.empty iconify-icon{color:var(--b);opacity:.7;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--b)}
.slab{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 12px 12px;z-index:4;box-shadow:0 -8px 24px rgba(16,24,40,.08)}
.hint{font-size:13px;color:var(--mute);font-weight:600;margin:0 4px 8px;min-height:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hint b{color:var(--ink)}
.cbox{display:flex;gap:8px;align-items:center}
.cbox form{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:16px;padding:4px 4px 4px 14px;min-width:0;border:1px solid transparent}
.cbox form:focus-within{border-color:var(--b);background:var(--card)}
.cbox input{border:0;background:none;padding:10px 0;margin:0;min-width:0;font-size:16px}
.rb{width:40px;height:40px;border-radius:12px;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--b);color:#fff}
.rb.ghost{background:var(--bl);color:var(--b);width:48px;height:48px;border-radius:15px}
.mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--b);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer;transition:transform .15s,background .15s}
.mic.rec{background:var(--red);transform:scale(1.08);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(240,68,56,.22)}50%{box-shadow:0 0 0 14px rgba(240,68,56,.06)}}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-end;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.x{background:var(--card);border:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--mute);flex:none}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:10px 16px;border-radius:99px;z-index:20;display:none;align-items:center;gap:6px;max-width:92%;font-size:14px}
.login{padding-top:12vh;text-align:center}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#2b6cf6,#5b93ff);color:#fff;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 10px 30px rgba(43,108,246,.3)}
.login h1{font-size:34px;margin-bottom:8px}
.hist{background:var(--card);border-radius:18px;padding:4px 14px;margin-bottom:10px}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .grow{flex:1;min-width:0}
.hrow button{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px;display:grid}
.big2{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.green{color:#16a34a}.redt{color:var(--red)}
/* ===== animatsiyalar ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.2) rotate(-14deg);opacity:0}60%{transform:scale(1.18) rotate(5deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
@keyframes shake{0%,12%,100%{transform:translateX(0)}3%,9%{transform:translateX(-4px)}6%{transform:translateX(4px)}}
@keyframes drop{0%,100%{transform:translateY(-1px)}50%{transform:translateY(3px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes donutIn{from{transform:rotate(-140deg) scale(.55);opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-18px) scale(.9)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes climb{0%{transform:translate(-3px,3px);opacity:.5}50%{transform:translate(2px,-2px);opacity:1}100%{transform:translate(-3px,3px);opacity:.5}}
#body.anim>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-5deg)}}
@keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@keyframes pill{from{transform:scale(.3);opacity:0}}
@keyframes sk{to{background-position:-200% 0}}
@keyframes breath{0%,100%{box-shadow:0 0 0 0 rgba(43,108,246,.38)}50%{box-shadow:0 0 0 11px rgba(43,108,246,0)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
@keyframes blink{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}}
.ico{animation:bob 3.6s ease-in-out infinite}
.card:nth-child(3n+1) .ico{animation-delay:-1.2s}.card:nth-child(3n+2) .ico{animation-delay:-2.4s}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 46%,transparent 62%);animation:shine 3.8s ease-in-out infinite 1.2s;z-index:1}
nav button{position:relative;z-index:0}
nav button.on::before{content:"";position:absolute;top:3px;left:50%;width:58px;height:32px;margin-left:-29px;border-radius:99px;background:var(--bl);z-index:-1;animation:pill .4s cubic-bezier(.2,.8,.2,1)}
.skel{height:120px;border-radius:20px;margin-bottom:10px;background:linear-gradient(90deg,#e6eaf0 25%,#f6f8fb 50%,#e6eaf0 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
.mic:not(.rec){animation:breath 2.8s ease-in-out infinite}
.rb:active,.mic:active,.pill:active{transform:scale(.9)}
.sway{animation:wiggle 3.5s ease-in-out infinite;display:grid}
.spark{position:absolute;color:#fff;animation:twinkle 2.4s ease-in-out infinite;z-index:1}
.uav{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#7a5af8,#9e77ed);color:#fff;display:grid;place-items:center;flex:none;animation:floaty 3s ease-in-out infinite;box-shadow:0 8px 20px rgba(122,90,248,.3)}
.uav.thinking iconify-icon{animation:wiggle .9s ease-in-out infinite}
.dots{display:inline-flex;gap:4px;margin-left:6px}.dots i{width:6px;height:6px;border-radius:50%;background:#7a5af8;animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.uout{margin-top:12px;font-size:14.5px;line-height:1.55;animation:slideIn .5s ease-out}
.uout b{color:#5925dc}
.uout .ubox{background:#f9f5ff;border-radius:14px;padding:12px 14px;margin-bottom:10px}
details.guide{background:var(--bg);border-radius:14px;padding:10px 12px;margin:12px 0}
details.guide summary{font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;list-style:none}
details.guide summary::-webkit-details-marker{display:none}
details.guide ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
details.guide li{margin-bottom:6px;animation:slideIn .4s ease-out both}
.formula{background:#fff;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;font-weight:700;color:#5925dc}
.rvrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rvrow .grow{flex:1;min-width:0}.rvrow button{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px;display:grid}
.rvres{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55;margin-top:10px;animation:slideIn .5s ease-out}
#body.anim .ico iconify-icon,#body.anim .av,#body.anim .stile small iconify-icon,#body.anim .frow .fi iconify-icon,#body.anim .tip iconify-icon{animation:pop .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms + 180ms)}
#body.anim .pbar i{animation:growX .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms + 200ms);transform-origin:left}
#body.anim .bcol i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j,0)*22ms + 160ms);transform-origin:bottom}
#body.anim .dg{animation:donutIn .9s cubic-bezier(.2,.8,.2,1) both .15s;transform-origin:80px 80px}
#body.anim .hline{animation:draw 1.4s ease-out both .3s}
#body.anim .harea{animation:fade 1s ease-out both .8s}
#body.anim .hbar{animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j,0)*20ms + 200ms);transform-box:fill-box;transform-origin:bottom}
#body.anim .hbar.neg{transform-origin:top}
.stat .sicon{position:absolute;right:16px;top:14px;z-index:1;opacity:.95;animation:floaty 3.2s ease-in-out infinite}
.pill .dl{animation:drop 1.6s ease-in-out infinite}
.pill.spinning iconify-icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty iconify-icon{animation:floaty 3s ease-in-out infinite}
nav button.just iconify-icon{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
nav button iconify-icon{transition:transform .2s}nav button:active iconify-icon{transform:scale(.85)}
#toast.show{animation:toastIn .35s cubic-bezier(.2,.8,.2,1)}
#toast.show iconify-icon{animation:pop .5s .1s both}
.mic{position:relative}
.mic.rec::before,.mic.rec::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);animation:ring 1.4s ease-out infinite}
.mic.rec::after{animation-delay:.7s}
.chip,.seg button,.stile,.card,.btn{transition:background .2s,color .2s,border-color .2s,transform .12s}
.card:active,.stile:active{transform:scale(.98)}
.hint .ok iconify-icon{animation:pop .5s both;color:var(--ok)}
/* ===== do'kon holati ===== */
.hero{border-radius:22px;padding:18px;margin-bottom:10px;color:#fff;position:relative;overflow:hidden}
.hero.ok{background:linear-gradient(135deg,#12b76a,#3ccb7f)}.hero.bad{background:linear-gradient(135deg,#f04438,#f97066)}
.hero:before{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero small{color:rgba(255,255,255,.85);font-weight:600}
.hero h3{font-size:20px;font-weight:800;margin-top:2px}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;position:relative}
.hero .hicon{position:absolute;right:16px;top:16px;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.hero.ok .hicon iconify-icon{animation:climb 2.4s ease-in-out infinite}
.hero.bad .hicon iconify-icon{animation:shake 3s ease-in-out infinite}
.hero .mg{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;margin-top:8px}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0}
.frow .fi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.frow span{flex:1;font-weight:600}
.frow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.frow.sum{border-top:2px dashed var(--line);margin-top:2px}
.frow.sum span,.frow.sum b{font-weight:800;font-size:17px}
.dir{display:flex;gap:8px;margin-top:10px}
.dir div{flex:1;background:var(--bg);border-radius:14px;padding:10px 12px}
.dir b{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:800}
.verdict{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:700}
.verdict.up{background:var(--okl);color:#067647}.verdict.down{background:var(--redl);color:var(--red)}.verdict.flat{background:var(--bg);color:var(--mute)}
.compass{animation:wiggle 4s ease-in-out infinite}
.beat{animation:beat 2s ease-in-out infinite}
.pills{display:flex;gap:8px}
.pills div{flex:1;border-radius:14px;padding:10px;text-align:center}
.pills b{display:block;font-size:22px;font-weight:800}
.pills small{font-size:12px;font-weight:700;color:inherit;opacity:.85}
.tip{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-weight:600;font-size:14.5px;line-height:1.45}
.tip .fi{width:30px;height:30px;border-radius:10px;background:#fef0c7;color:#b54708;display:grid;place-items:center;flex:none}
.hchart svg{display:block;width:100%;height:auto;overflow:visible}
.hbar{cursor:pointer}
.mini{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;width:100%;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.mini .ico{width:46px;height:46px}
.mini .grow{flex:1;min-width:0}
@media(min-width:900px){#app{max-width:720px}.slab{max-width:720px}}

<body>

<script>
const API = "https://gaincffqsfpezjnxwvwc.supabase.co/functions/v1/xarajat/api";
const ic = (n, s = 22) => `<iconify-icon icon="solar:${n}" width="${s}" height="${s}"></iconify-icon>`;
// [ikonka, nom, rang]
const CATS = {
  dokon:{tovar:["box-bold-duotone","Tovar / yuk","#7a5af8"],firma:["delivery-bold-duotone","Firmaga to'lov","#2b6cf6"],ijara:["home-2-bold-duotone","Do'kon ijarasi","#06aed4"],oylik:["users-group-rounded-bold-duotone","Ish haqi","#ee46bc"],yol:["bus-bold-duotone","Yo'l / yetkazish","#f79009"],remont:["settings-bold-duotone","Jihoz / remont","#667085"],boshqa:["shop-bold-duotone","Do'kon boshqa","#84a3c4"]},
  shaxsiy:{oila:["users-group-two-rounded-bold-duotone","Oilaga / qarindoshga","#ee46bc"],ovqat:["cup-hot-bold-duotone","Ovqat / kafe","#fb6514"],oziq:["cart-large-2-bold-duotone","Bozor / oziq-ovqat","#12b76a"],transport:["bus-bold-duotone","Transport / taksi","#f79009"],uy:["home-smile-bold-duotone","Uy-ro'zg'or","#06aed4"],aloqa:["smartphone-bold-duotone","Telefon / internet","#2b6cf6"],kiyim:["t-shirt-bold-duotone","Kiyim","#d444f1"],soglik:["health-bold-duotone","Sog'liq","#f04438"],talim:["book-bold-duotone","Ta'lim","#7a5af8"],dam:["gamepad-bold-duotone","Dam olish","#15b79e"],sovga:["gift-bold-duotone","Sovg'a","#e31b54"],boshqa:["widget-4-bold-duotone","Shaxsiy boshqa","#84a3c4"]},
  kommunal:{svet:["bolt-bold-duotone","Svet (elektr)","#eaaa08"],gaz:["fire-bold-duotone","Gaz","#fb6514"],suv:["waterdrops-bold-duotone","Suv","#0ba5ec"],soliq:["bill-list-bold-duotone","Soliq","#475467"],kommunal:["buildings-2-bold-duotone","Boshqa kommunal","#b54708"]}
};
// bo'limlar: nom, ikonka, rang, fon
const SC = {dokon:{n:"Do'kon",i:"shop-bold",c:"#2b6cf6",bg:"#e8f0ff"}, shaxsiy:{n:"Shaxsiy",i:"user-rounded-bold",c:"#6941c6",bg:"#f4ebff"}, kommunal:{n:"Kommunal",i:"bill-list-bold",c:"#b54708",bg:"#fef0c7"}};
const SCOPES = ["dokon","shaxsiy","kommunal"];
const MON3 = ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
const SAVDO = ["wallet-money-bold-duotone","Kunlik savdo","#12b76a"];
const MON = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const som = n => fmt(n) + " so'm";
const short = n => Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(Math.abs(n) % 1e6 ? 1 : 0) + " mln" : Math.abs(n) >= 1e3 ? Math.round(n / 1e3) + "k" : String(Math.round(n));
const digits = v => Math.round(+String(v ?? "").replace(/[^\d]/g, "") || 0);
const iso = d => d.toLocaleDateString("sv-SE");
const today = () => iso(new Date());
const dAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const mStart = (k = 0) => { const d = new Date(); return iso(new Date(d.getFullYear(), d.getMonth() + k, 1)); };
const mEnd = (k = 0) => { const d = new Date(); return iso(new Date(d.getFullYear(), d.getMonth() + k + 1, 0)); };
const dLabel = d => d === today() ? "Bugun" : d === dAgo(1) ? "Kecha" : (() => { const x = new Date(d + "T00:00:00"); return x.getDate() + "-" + MON[x.getMonth()]; })();
const hhmm = ts => { const d = new Date(ts); return isNaN(d) ? "" : String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const cat = (s, c) => c === "savdo" ? SAVDO : CATS[s]?.[c] || ["widget-4-bold-duotone", c, "#84a3c4"];
const isS = r => r.kind === "savdo";
const sum = rs => rs.reduce((a, r) => a + +r.amount, 0);
const tint = c => c + "1f";
const pkey = s => String(s || "").trim().toLowerCase().replace(/[ʻʼ‘’`´]/g, "'").replace(/\s+/g, " ");
const AVC = ["#2b6cf6","#12b76a","#f79009","#7a5af8","#ee46bc","#06aed4","#fb6514","#667085"];
const avc = s => AVC[[...pkey(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length];
const ini = s => String(s || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();

const tgw = window.Telegram?.WebApp;
try{ tgw?.ready(); tgw?.expand(); tgw?.setHeaderColor?.("#f2f4f7"); tgw?.setBackgroundColor?.("#f2f4f7"); }catch(e){}

let T = "", ROWS = [], DEBTS = [], tab = "home", per = "today", scope = "all", dtab = "in", dq = "", busy = false, edit = null, dform = null, PL = [];
try{ T = localStorage.getItem("xr_t") || ""; }catch(e){}
const hm = location.hash.match(/t=([\w-]{20,})/);
if(hm){ T = hm[1]; try{ localStorage.setItem("xr_t", T); }catch(e){} history.replaceState(null, "", location.pathname); }
try{ tab = localStorage.getItem("xr_tab") || "home"; }catch(e){}

async function api(action, body = {}){
  const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({t:T, action, ...body})});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401){ logout(); throw new Error("Kirish muddati tugagan"); }
  if(!r.ok) throw new Error(j.error || "Xatolik");
  return j;
}
function logout(){ T = ""; try{ localStorage.removeItem("xr_t"); }catch(e){} loginView(); }
let tT;
function toast(msg, icon = "check-circle-bold"){
  const t = $("#toast"); t.innerHTML = ic(icon, 18) + `<span>${msg}</span>`; t.style.display = "flex"; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  clearTimeout(tT); tT = setTimeout(() => t.style.display = "none", 2600);
}
function loginView(){
  $(".slab")?.remove(); $("nav")?.remove();
  $("#app").innerHTML = `<div class="login"><div class="logo">${ic("wallet-money-bold-duotone", 38)}</div><h1>Xarajatlar</h1>
  <p style="color:var(--mute);margin-bottom:22px">Kirish uchun Telegram botda<br><b style="color:var(--ink)">📱 Ilovani ochish</b> tugmasini bosing</p>
  <a class="btn b" style="display:inline-flex;text-decoration:none" href="https://t.me/menku_bubot">${ic("plain-2-bold", 20)} Botni ochish</a></div>`;
}

/* ---------- davr ---------- */
const PER = [["today","Bugun"],["yday","Kecha"],["week","7 kun"],["month","Shu oy"],["prev","O'tgan oy"]];
function range(){
  if(per === "today") return [today(), today()];
  if(per === "yday") return [dAgo(1), dAgo(1)];
  if(per === "week") return [dAgo(6), today()];
  if(per === "month") return [mStart(), today()];
  return [mStart(-1), mEnd(-1)];
}
const inDates = r => { const [a, b] = range(); return r.spent_on >= a && r.spent_on <= b; };
const inRange = r => inDates(r) && (scope === "all" || isS(r) || r.scope === scope);

async function load(){
  document.querySelectorAll(".pill.rf").forEach(b => b.classList.add("spinning"));
  try{
    const [j, rv] = await Promise.all([api("list", {from: mStart(-1) < dAgo(62) ? mStart(-1) : dAgo(62)}), api("revizya_list").catch(() => ({rows:[]}))]);
    ROWS = j.rows || []; DEBTS = j.debts || []; REV = rv.rows || []; ANIM = true; draw();
  }catch(e){ if(T && $("#body")) $("#body").innerHTML = `<div class="empty">${ic("danger-triangle-bold-duotone", 42)}<br>${esc(e.message)}</div>`; }
}

function shell(){
  $("#app").innerHTML = `<div id="body"><div class="skel" style="height:60px;width:60%"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:150px"></div><div class="skel" style="height:90px"></div><div class="skel" style="height:90px"></div></div>`;
  if(!$(".slab")){
    const s = document.createElement("div"); s.className = "slab";
    s.innerHTML = `<div class="hint" id="hint">Yozing yoki ayting: <b>«svetga 250 ming»</b>, <b>«savdo 3 mln»</b>, <b>«Ali 50 ming nasiya oldi»</b></div>
    <div class="cbox"><button class="rb ghost" onclick="tab==='debts'?openDebtForm():openForm()" aria-label="Qo'lda qo'shish">${ic("add-circle-bold", 26)}</button>
      <form onsubmit="event.preventDefault();sendText()"><input id="tx" placeholder="Xarajat, savdo yoki qarz..." autocomplete="off" enterkeyhint="send">
      <button class="rb" type="submit" aria-label="Yuborish">${ic("plain-2-bold", 20)}</button></form>
      <button class="mic" id="mic" onclick="toggleRec()" aria-label="Ovoz">${ic("microphone-3-bold", 26)}</button></div>`;
    document.body.appendChild(s);
    document.body.appendChild(document.createElement("nav"));
  }
}
let lastTab = "", ANIM = true;
function drawNav(){
  const N = [["home","home-smile-bold-duotone","Asosiy"],["holat","graph-up-bold-duotone","Holat"],["list","document-text-bold-duotone","Ro'yxat"],["debts","notebook-bold-duotone","Qarzlar"]];
  $("nav").innerHTML = N.map(([k, i, l]) => `<button class="${tab===k?"on":""} ${tab===k && lastTab!==k ? "just" : ""}" onclick="go('${k}')">${ic(i, 26)}${l}</button>`).join("");
  lastTab = tab;
}
function go(k){ tab = k; try{ localStorage.setItem("xr_tab", k); }catch(e){} ANIM = true; draw(); scrollTo(0, 0); try{ tgw?.HapticFeedback?.impactOccurred("light"); }catch(e){} }
// animatsiya: bloklar ketma-ket chiqadi, raqamlar sanaladi
function afterDraw(){
  const b = $("#body"); if(!b) return;
  if(ANIM){
    [...b.children].forEach((el, i) => el.style.setProperty("--i", Math.min(i, 12)));
    b.classList.remove("anim"); void b.offsetWidth; b.classList.add("anim");
    b.querySelectorAll("[data-n]").forEach(el => {
      const v = +el.dataset.n, pre = el.dataset.pre || "", t0 = performance.now(), dur = 900;
      const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = pre + fmt(v * e); if(k < 1) requestAnimationFrame(step); };
      el.textContent = pre + "0"; requestAnimationFrame(step);
    });
    clearTimeout(window.aT); window.aT = setTimeout(() => b.classList.remove("anim"), 2200);
  }
  ANIM = false;
  document.querySelectorAll(".pill.rf").forEach(x => x.classList.remove("spinning"));
}
const N_ = (v, pre = "") => `<span data-n="${Math.round(v)}" data-pre="${pre}">${pre}${fmt(v)}</span>`;

function header(title, sub, pdf = true){
  return `<div class="top"><div><small>${sub}</small><h1>${title}</h1></div><div class="row" style="gap:6px;flex:none">
    ${pdf ? `<button class="pill" onclick="openPdf()" aria-label="PDF hisobot"><span class="dl" style="display:grid">${ic("file-download-bold", 16)}</span> PDF</button>` : ""}
    <button class="pill rf" onclick="load().then(()=>toast('Yangilandi'))" aria-label="Yangilash">${ic("refresh-bold", 16)}</button></div></div>`;
}
function perChips(){ return `<div class="chips">${PER.map(([k, l]) => `<button class="chip ${per===k?"on":""}" onclick="per='${k}';ANIM=true;draw()">${l}</button>`).join("")}</div>`; }
function scopeSeg(){ return `<div class="seg">${[["all","Hammasi","widget-bold"], ...SCOPES.map(k => [k, SC[k].n, SC[k].i])].map(([k, l, i]) => `<button class="${scope===k?"on":""}" onclick="scope='${k}';ANIM=true;draw()">${ic(i, 16)}${l}</button>`).join("")}</div>`; }

function draw(){
  if(!$("#body")) return;
  drawNav();
  if(tab === "debts") drawDebts();
  else if(tab === "list") drawList();
  else if(tab === "holat") drawHolat();
  else drawHome();
  afterDraw();
}

/* ---------- Asosiy ---------- */
function drawHome(){
  const all = ROWS.filter(inRange), rs = all.filter(r => !isS(r)), tot = sum(rs);
  const sv = scope === "all" || scope === "dokon" ? sum(ROWS.filter(inDates).filter(isS)) : 0, left = sv - tot;
  const pl = PER.find(p => p[0] === per)[1], d = new Date();
  let h = header("Xarajatlar", d.getDate() + "-" + MON[d.getMonth()] + ", " + d.getFullYear()) + perChips() + scopeSeg();
  h += `<div class="stat"><i class="shine"></i><span class="sicon">${ic("wallet-money-bold-duotone", 34)}</span><small>${pl} · ${rs.length} ta xarajat${scope !== "all" ? " · " + SC[scope].n : ""}</small><div class="big">${N_(tot)} so'm</div>
    <div class="sp"><div><small>${ic("arrow-down-left-bold", 14)} Savdo</small><b>${N_(sv)}</b></div><div><small>${ic(left >= 0 ? "check-circle-bold" : "danger-triangle-bold", 14)} Qoldi</small><b>${N_(left)}</b></div></div></div>`;
  // 3 bo'lim: bosilsa filtr
  const allX = ROWS.filter(inDates).filter(r => !isS(r)), totX = sum(allX);
  h += `<div class="stiles">${SCOPES.map(k => { const v = sum(allX.filter(r => r.scope === k));
    return `<button class="stile ${scope === k ? "on" : ""}" style="color:${SC[k].c}" onclick="scope=scope==='${k}'?'all':'${k}';ANIM=true;draw()"><small>${ic(SC[k].i, 14)}${SC[k].n}</small><b>${short(v)}</b><div class="pbar" style="background:${SC[k].bg}"><i style="width:${totX ? v / totX * 100 : 0}%;background:${SC[k].c}"></i></div></button>`; }).join("")}</div>`;
  // do'kon holati (shu oy) — qisqa
  { const H = health(mStart(), today()); if(H.sv || H.shop){ const ok = H.foyda >= 0;
    h += `<button class="mini" onclick="go('holat')"><div class="ico" style="background:${ok ? "var(--okl)" : "var(--redl)"};color:${ok ? "#067647" : "var(--red)"}"><span class="beat" style="display:grid">${ic(ok ? "graph-up-bold-duotone" : "graph-down-bold-duotone", 26)}</span></div>
      <div class="grow"><small>Do'kon holati · shu oy</small><b style="color:${ok ? "#067647" : "var(--red)"}">${ok ? "Foydada" : "Zararda"} ${ok ? "+" : "−"}${fmt(Math.abs(H.foyda))}</b></div>${ic("alt-arrow-right-linear", 22)}</button>`; } }
  const P = people(), inn = P.filter(p => p.dir === "in" && p.bal > 0), out = P.filter(p => p.dir === "out" && p.bal > 0);
  if(inn.length || out.length) h += `<div class="dtiles" onclick="go('debts')" style="cursor:pointer"><div class="dtile in"><small>${ic("arrow-down-left-bold", 15)} Menga qarzdor</small><b>${fmt(sum(inn.map(p => ({amount:p.bal}))))}</b></div><div class="dtile out"><small>${ic("arrow-up-right-bold", 15)} Mening qarzim</small><b>${fmt(sum(out.map(p => ({amount:p.bal}))))}</b></div></div>`;
  // kunlik grafik: surib ko'rish, bosganda raqamlar
  if(per !== "today" && per !== "yday"){
    const [a, b] = range(), days = [];
    for(let x = new Date(a + "T00:00:00"); iso(x) <= b; x.setDate(x.getDate() + 1)) days.push(iso(x));
    const ex = {}, sl = {}; all.forEach(r => { const o = isS(r) ? sl : ex; o[r.spent_on] = (o[r.spent_on] || 0) + +r.amount; });
    BD = {days, ex, sl};
    if(!days.includes(selDay)) selDay = days.includes(today()) ? today() : days[days.length - 1];
    h += `<h2><span>Kunlar bo'yicha</span><span>${days.length > 8 ? "← surib ko'ring →" : days.length + " kun"}</span></h2><div class="panel"><div id="binfo"></div>${barsHtml()}
      <div class="legend"><span><i style="background:var(--red)"></i>Xarajat</span>${days.some(x => sl[x]) ? `<span><i style="background:var(--ok)"></i>Savdo</span>` : ""}<span style="margin-left:auto">Kunni bosing</span></div></div>`;
  } else BD = null;
  // turlar: doira (bosiladi) + ro'yxat
  const bc = {}; rs.forEach(r => { const k = r.scope + "|" + r.cat; bc[k] = (bc[k] || 0) + +r.amount; });
  const cs = Object.entries(bc).sort((a, b) => b[1] - a[1]);
  DS = {cs, tot}; if(selCat != null && selCat >= cs.length) selCat = null;
  if(cs.length){
    h += `<h2><span>Nimaga ketdi</span><span>${cs.length} tur</span></h2><div class="panel" id="dpanel"></div>`;
    h += cs.map(([k, v]) => { const [s, c] = k.split("|"), x = cat(s, c);
      return `<button class="card" onclick="go('list')"><div class="ico" style="background:${tint(x[2])};color:${x[2]}">${ic(x[0], 24)}</div><div class="grow"><b>${esc(x[1])}</b><small>${SC[s]?.n ?? s} · ${Math.round(v / tot * 100)}%</small><div class="pbar"><i style="width:${v / cs[0][1] * 100}%;background:${x[2]}"></i></div></div><div class="right">${fmt(v)}</div></button>`; }).join("");
  }
  const last = all.slice(0, 5);
  h += `<h2><span>Oxirgi yozuvlar</span>${all.length > 5 ? `<button class="link" style="width:auto;padding:0" onclick="go('list')">Hammasi →</button>` : ""}</h2>`;
  h += last.length ? last.map(item).join("") : `<div class="empty">${ic("bill-list-bold-duotone", 48)}<br>Bu davrda yozuv yo'q<br><small>Pastda yozing yoki mikrofonni bosing</small></div>`;
  $("#body").innerHTML = h;
  if(BD){ dayInfo(); const sc = $("#bscroll"), on = sc?.querySelector(".bcol.on"); if(sc && on) sc.scrollLeft = on.offsetLeft - sc.clientWidth + on.offsetWidth + 12; }
  if(cs.length) drawDonut();
}
let BD = null, DS = null, selDay = null, selCat = null;
function barsHtml(){
  const {days, ex, sl} = BD, hasS = days.some(x => sl[x]), mx = Math.max(...days.map(x => Math.max(ex[x] || 0, sl[x] || 0)), 1);

function health(a, b){
  const rs = ROWS.filter(r => r.spent_on >= a && r.spent_on <= b);
  const S = k => sum(rs.filter(r => !isS(r) && r.scope === k));
  const sv = sum(rs.filter(isS)), shop = S("dokon"), me = S("shaxsiy"), kom = S("kommunal"), per = [];
  for(let x = new Date(a + "T00:00:00"); iso(x) <= b && iso(x) <= today(); x.setDate(x.getDate() + 1)){
    const d = iso(x), xs = rs.filter(r => r.spent_on === d), s = sum(xs.filter(isS)), e = sum(xs.filter(r => !isS(r) && r.scope === "dokon"));
    per.push({d, s, e, p:s - e});
  }
  const bc = {}; rs.filter(r => !isS(r) && r.scope === "dokon").forEach(r => bc[r.cat] = (bc[r.cat] || 0) + +r.amount);
  const top = Object.entries(bc).sort((x, y) => y[1] - x[1])[0];
  return {sv, shop, me, kom, foyda:sv - shop, qoldi:sv - shop - me - kom, per, n:per.length, top,
    salesDays:per.filter(p => p.s > 0).length, good:per.filter(p => p.s > 0 && p.p >= 0).length, bad:per.filter(p => p.s > 0 && p.p < 0).length, missing:per.filter(p => p.s === 0 && p.e > 0).length};
}

let rec = null, chunks = [], stream = null, rT = null, rS = 0;

}

  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for(let i = 0; i < pcm.length; i++){ const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }

}

  modal(`<div class="mh"><h1 style="font-size:22px">${e.id ? "Tahrirlash" : "Yangi yozuv"}</h1><button class="x" onclick="closeModal()">${ic("close-circle-linear", 22)}</button></div>
  <div class="seg ${e.kind === "savdo" ? "in" : "out"}">${[["xarajat","Xarajat","arrow-up-right-bold"],["savdo","Savdo","arrow-down-left-bold"]].map(([k, l, i]) => `<button class="${e.kind===k?"on":""}" onclick="edit.kind='${k}';drawForm()">${ic(i, 18)}${l}</button>`).join("")}</div>
  ${e.kind === "savdo" ? "" : `<div class="seg">${SCOPES.map(k => `<button class="${e.scope===k?"on":""}" onclick="edit.scope='${k}';if(!CATS['${k}'][edit.cat])edit.cat=Object.keys(CATS['${k}'])[0];drawForm()">${ic(SC[k].i, 16)}${SC[k].n}</button>`).join("")}</div>
  <div class="chips wrap">${Object.entries(CATS[e.scope] || CATS.dokon).map(([k, [i, l, c]]) => `<button class="chip ${e.cat===k?"on":""}" onclick="edit.cat='${k}';drawForm()"><span style="color:${c};display:grid">${ic(i, 18)}</span>${l}</button>`).join("")}</div>`}
  ${e.kind !== "savdo" && e.scope === "dokon" && e.cat === "firma" ? `<label class="field">${ic("delivery-bold-duotone", 22)}<input list="fl" placeholder="Firma nomi" value="${esc(e.firm)}" oninput="edit.firm=this.value" autocomplete="off"></label><datalist id="fl">${firms.map(f => `<option value="${esc(f)}">`).join("")}</datalist>` : ""}
  <label class="field">${ic("wallet-money-bold-duotone", 22)}<input inputmode="numeric" id="ea" placeholder="Summa" value="${e.amount ? fmt(e.amount) : ""}" oninput="edit.amount=digits(this.value);this.value=edit.amount?fmt(edit.amount):''"></label>
  <label class="field">${ic("calendar-bold-duotone", 22)}<input type="date" value="${e.date}" max="${today()}" onchange="edit.date=this.value||today()"></label>
  <label class="field">${ic("pen-2-bold-duotone", 22)}<input value="${esc(e.note)}" oninput="edit.note=this.value" placeholder="Izoh (ixtiyoriy)"></label>
  <div class="row" style="margin-top:4px">${e.id ? `<button class="btn red" onclick="delItem()">${ic("trash-bin-trash-bold", 20)} O'chirish</button>` : ""}<button class="btn b" id="esave" onclick="saveForm()">${ic("check-circle-bold", 20)} Saqlash</button></div>`);
}
async function saveForm(){
  const e = edit; if(!(e.amount > 0)) return toast("Summani kiriting", "danger-triangle-bold");
  if(e.kind !== "savdo" && e.scope === "dokon" && e.cat === "firma" && !e.firm.trim()) return toast("Firma nomini kiriting", "danger-triangle-bold");
  const b = $("#esave"); b.disabled = true;
  try{
    const body = {kind:e.kind, scope:e.scope, cat:e.kind === "savdo" ? "savdo" : e.cat, amount:e.amount, firm:e.firm, note:e.note, date:e.date};
    if(e.id){ const j = await api("update", {id:e.id, ...body}); ROWS = ROWS.map(r => r.id === e.id ? j.row : r); toast("Saqlandi"); closeModal(); draw(); }
    else { const j = await api("add", body); closeModal(); afterSave(j); toast("Qo'shildi"); }
  }catch(err){ b.disabled = false; toast(esc(err.message), "danger-triangle-bold"); }
}
async function delItem(){
  if(!confirm("Bu yozuv o'chirilsinmi?")) return;
  try{ await api("del", {id:edit.id}); ROWS = ROWS.filter(r => r.id !== edit.id); closeModal(); draw(); toast("O'chirildi"); }
  catch(e){ toast(esc(e.message), "danger-triangle-bold"); }
}

if(T){ shell(); drawNav(); load(); } else loginView();
</script>
</body>
</html>
