services:
  - type: web
    name: nakladnoy-bot
    runtime: python
    plan: free
    rootDir: nakladnoy-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MARJA
        value: "22"
      - key: YAXLITLASH
        value: "100"
      - key: ALLOWED_USERS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
