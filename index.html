<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#101828;--mute:#8a94a6;--line:#e6e9ef;--b:#2b6cf6;--bl:#e8f0ff;--red:#f04438;--redl:#fee4e2;--ok:#12b76a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{font:500 16px/1.4 Manrope,-apple-system,system-ui,sans-serif;color:var(--ink);padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding:10px 14px calc(250px + env(safe-area-inset-bottom))}
iconify-icon{display:inline-block;vertical-align:middle;flex:none}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:14px;font-weight:700;margin:20px 0 8px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.mute{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px}
.pill{background:var(--bl);color:var(--b);font-weight:700;font-size:13px;padding:7px 12px;border-radius:99px;display:flex;align-items:center;gap:6px}
input,select{font:inherit;color:inherit;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;outline:0}
input:focus,select:focus{border-color:var(--b)}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
.field:focus-within{border-color:var(--b)}
.field input{border:0;background:none;padding:14px 0;margin:0}
.field iconify-icon{color:var(--b)}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.b{background:var(--b);color:#fff;border-color:var(--b)}
.btn.b:disabled{opacity:.45}
.btn.red{background:var(--redl);color:var(--red);border-color:var(--redl)}
.btn.full{width:100%}.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}.row>.auto{flex:none}
.card{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.card>.grow{flex:1;min-width:0}
.card b{display:block;overflow:hidden;text-overflow:ellipsis}
.ico{width:44px;height:44px;border-radius:12px;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none}
.blue{color:var(--b)}
.right{text-align:right;flex:none}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bl);color:var(--b);display:inline-block}
.tag.low{background:var(--redl);color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{font:inherit;font-weight:700;font-size:14px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px}
.chip.on{background:var(--bl);color:var(--b);border-color:var(--bl)}
.qty{display:flex;align-items:center;gap:2px;flex:none;background:var(--bg);border-radius:12px;padding:4px}
.qty button{background:none;border:0;color:var(--b);padding:4px;cursor:pointer;display:grid}
.qty b{min-width:36px;text-align:center;font-size:17px}
.stat{background:var(--b);color:#fff;border-radius:22px;padding:18px;margin-bottom:10px}
.stat small{color:rgba(255,255,255,.75)}
.stat .big{font-size:30px;font-weight:800;margin-top:4px}
.bars{display:flex;gap:8px;height:130px;align-items:flex-end;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars i{width:100%;background:var(--b);border-radius:8px 8px 4px 4px;min-height:3px}
.bars div:last-child i{background:#10b981}
.scan{display:none;position:relative;border-radius:20px;overflow:hidden;margin:0 0 12px;background:#000}
.scan.on{display:block}
.scan i{position:absolute;width:32px;height:32px;border:4px solid var(--b);z-index:2;pointer-events:none}
.tl{top:12px;left:12px;border-right:0!important;border-bottom:0!important;border-radius:12px 0 0 0}
.tr{top:12px;right:12px;border-left:0!important;border-bottom:0!important;border-radius:0 12px 0 0}
.bl{bottom:12px;left:12px;border-right:0!important;border-top:0!important;border-radius:0 0 0 12px}
.br{bottom:12px;right:12px;border-left:0!important;border-top:0!important;border-radius:0 0 12px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.empty iconify-icon{color:var(--b);opacity:.7;margin-bottom:8px}
.sw{width:46px;height:28px;border-radius:99px;background:#d0d5dd;position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--b)}.sw.on:after{left:21px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
nav button.on{color:var(--b)}
.slab{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:14px;z-index:4;box-shadow:0 -8px 24px rgba(16,24,40,.08)}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.srow b{font-size:22px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-end;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:10px 16px;border-radius:99px;z-index:20;display:none;align-items:center;gap:6px;max-width:92%}
.login{padding-top:9vh}
.logo{width:68px;height:68px;border-radius:20px;background:var(--b);color:#fff;display:grid;place-items:center;margin-bottom:18px}
.login h1{font-size:38px;margin-bottom:6px}.login p{margin-bottom:22px}
.err{color:var(--red);margin:4px 0 10px;min-height:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#rcpt{display:none}
.rank{width:28px;height:28px;border-radius:9px;background:var(--bl);color:var(--b);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.pbar{height:6px;border-radius:99px;background:var(--bl);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--b);border-radius:99px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
@media(min-width:900px){#app{max-width:860px}.slab{max-width:860px}}
@page{margin:0}
@media print{html,body{background:#fff!important}body>*:not(#rcpt){display:none!important}
#rcpt{display:block;font:12px/1.35 "Courier New",monospace;color:#000;padding:2mm}
#rcpt .r{display:flex;justify-content:space-between;gap:6px}#rcpt hr{border:0;border-top:1px dashed #000;margin:4px 0}#rcpt .c{text-align:center}}
</style>

<body>

<script>
// ===== SOZLAMA =====
const SUPABASE_URL = "https://qdokkscmadhzndpbqmwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_PGnP21p8l63SVIrCTFQ6ug_o6M7ND6S";
// ===================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, s = 22) => `<iconify-icon icon="solar:${n}" width="${s}" height="${s}"></iconify-icon>`;
const money = n => Math.round(n).toLocaleString("ru-RU") + " so'm";
const fmtT = d => new Date(d).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
const DEF = {shop:"Do'kon", beep:true, vib:true, low:5, auto:false, print:false, pw:80, foot:"Xaridingiz uchun rahmat!"};
let S = {...DEF};
try{ S = {...DEF, ...JSON.parse(localStorage.getItem("dk") || "{}")}; }catch(e){}
const saveS = () => { try{ localStorage.setItem("dk", JSON.stringify(S)); }catch(e){} };
let me = null, tab = "sell", cart = [], scanner = null, last = {c:"", t:0}, P = new Map(), pf = "all", shown = [], ac;
const CORNERS = '<i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>';
const blank = () => ({barcode:"", name:"", price:0, stock:0, unit:"dona", isNew:true});

function toast(m, icon = "check-circle-bold"){
  const t = $("#toast"); t.innerHTML = ic(icon, 20) + esc(m); t.style.display = "flex";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600);
}
function feedback(){
  if(S.vib && navigator.vibrate) navigator.vibrate(50);
  if(!S.beep) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value = 1100; g.gain.value = .15;
    o.start(); o.stop(ac.currentTime + .08);
  }catch(e){}
}
async function loadP(){
  const m = new Map();
  try{
    for(let f = 0; ; f += 1000){
      const {data, error} = await T(sb.from("products").select("*").range(f, f + 999), 12000);
      if(error) throw error;
      (data || []).forEach(p => m.set(p.barcode, p));
      if(!data || data.length < 1000) break;
    }
    P = m; cacheP();
  }catch(e){
    if(!P.size){ try{ JSON.parse(localStorage.getItem("dp") || "[]").forEach(p => m.set(p.barcode, p)); P = m; }catch(x){} }
  }
}

async function init(){
  wl();
  let session = null;
  try{ ({data:{session}} = await T(sb.auth.getSession(), 6000)); }catch(e){}
  let cached = null; try{ cached = JSON.parse(localStorage.getItem("dme")); }catch(e){}
  if(!session && !(cached && navigator.onLine === false)) return loginView();
  let prof = null;
  if(session){
    try{
      const {data} = await T(sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle());
      prof = data; if(prof) localStorage.setItem("dme", JSON.stringify(prof));
    }catch(e){}
  }
  me = prof || cached;
  if(!me) return loginView("Internetga ulanib bo'lmadi");
  if(me.role === "pending") return pendingView();
  await loadP(); show("sell"); flush();
}

/* ---------- BARQARORLIK: oflayn navbat, taymaut, chop etish ---------- */
const FINE = matchMedia("(pointer:fine)").matches;
const T = (p, ms = 8000) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms))]);
const uid = () => crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : r & 3 | 8).toString(16); });
const code6 = id => String(id || "").slice(0, 6).toUpperCase();
let Q = []; try{ Q = JSON.parse(localStorage.getItem("dq") || "[]"); }catch(e){}
const saveQ = () => { try{ localStorage.setItem("dq", JSON.stringify(Q)); }catch(e){} };
const cacheP = () => { clearTimeout(cacheP.t); cacheP.t = setTimeout(() => { try{ localStorage.setItem("dp", JSON.stringify([...P.values()])); }catch(e){} }, 800); };
function updBadge(){ const e = $("#syncb"); if(e){ e.style.display = Q.length ? "flex" : "none"; e.innerHTML = ic("cloud-upload-bold", 16) + Q.length; } }
let flushing = false;
async function flush(){
  if(flushing || !Q.length || !me) return;
  flushing = true; let sent = false;
  try{
    while(Q.length){
      const s = Q[0];
      const {error} = await T(sb.rpc("make_sale", {p_client:s.id, p_items:s.items, p_at:s.at}), 10000);
      if(error){ if(!flush.w){ flush.w = 1; toast("Sinxronlash: " + error.message, "danger-triangle-bold"); } break; }
      Q.shift(); saveQ(); sent = true; updBadge();
    }
  }catch(e){}
  flushing = false; updBadge();
  if(sent && !Q.length) loadP();
}
async function wl(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} }
function printReceipt(r){
  const el = $("#rcpt"), n = x => money(x).replace(" so'm", "");
  el.style.width = S.pw == 58 ? "48mm" : "72mm";
  el.innerHTML = `<div class="c"><b style="font-size:15px">${esc(S.shop)}</b><br>${fmtT(r.at)}<br>Chek: ${esc(r.code)}${r.status === "canceled" ? "<br><b>BEKOR QILINGAN</b>" : ""}</div><hr>`
    + r.items.map(i => `<div>${esc(i.name)}</div><div class="r"><span>${i.qty} x ${n(i.price)}</span><span>${n(i.qty * i.price)}</span></div>`).join("")
    + `<hr><div class="r"><b>JAMI</b><b>${money(r.total)}</b></div><hr><div class="c">${esc(S.foot)}</div>`;
  setTimeout(() => window.print(), 80);
}

/* ---------- KIRISH ---------- */
function loginView(msg = ""){
  $("#app").innerHTML = `<div class="login"><div class="logo">${ic("shop-2-bold-duotone", 38)}</div>
  <h1>${esc(S.shop)}</h1><p class="mute">Savdo, ombor va hisobot bitta ilovada</p>
  <label class="field">${ic("letter-bold-duotone")}<input id="em" type="email" placeholder="Email" autocomplete="email"></label>
  <label class="field">${ic("lock-password-bold-duotone")}<input id="pw" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password"></label>
  <div class="err">${esc(msg)}</div>
  <div class="row"><button class="btn b" onclick="login()">Kirish</button><button class="btn" onclick="signup()">Ro'yxatdan o'tish</button></div></div>`;
}
async function login(){
  const {error} = await sb.auth.signInWithPassword({email:$("#em").value.trim(), password:$("#pw").value});
  error ? loginView(/confirm/i.test(error.message) ? "Email tasdiqlanmagan: xatdagi havolani bosing" : "Email yoki parol noto'g'ri") : init();
}
async function signup(){
  const {data, error} = await sb.auth.signUp({email:$("#em").value.trim(), password:$("#pw").value});
  if(error) return loginView(error.message);
  data.session ? init() : loginView("Tasdiqlash xati yuborildi. Emailingizni tekshiring.");
}
function pendingView(){
  $("#app").innerHTML = `<div class="login"><div class="logo">${ic("hourglass-bold-duotone", 38)}</div><h1 style="font-size:30px">Kutilmoqda</h1>
  <p class="mute">Egasi sizni admin qilib tasdiqlaguncha kuting, so'ng sahifani yangilang.</p>
  <button class="btn full" onclick="logout()">${ic("logout-2-bold-duotone")} Chiqish</button></div>`;
}
async function logout(){
  await stopScan(); $("#slab")?.remove();
  try{ await T(sb.auth.signOut(), 4000); }catch(e){}
  try{ localStorage.removeItem("dme"); }catch(e){}
  me = null; cart = []; loginView();
}

/* ---------- ASOSIY ---------- */
function show(t){
  stopScan(); $("#slab")?.remove(); tab = t;
  const hl = t === "admins" ? "set" : t;
  const tabs = [["sell","cart-large-2-bold-duotone","Sotuv"], ["rec","bill-list-bold-duotone","Cheklar"], ["products","box-bold-duotone","Mahsulot"]];
  if(me.role === "owner") tabs.push(["report","chart-2-bold-duotone","Hisobot"]);
  tabs.push(["set","settings-bold-duotone","Sozlama"]);
  $("#app").innerHTML = `<div id="view"></div><nav>${tabs.map(([k,i,l]) => `<button class="${k===hl?"on":""}" onclick="show('${k}')">${ic(i,26)}${l}</button>`).join("")}</nav>`;
  ({sell:sellView, rec:receiptsView, products:productsView, report:reportView, set:setView, admins:adminsView})[t]();
  updBadge();
}
function head(title){
  return `<div class="top"><div><small>${esc(S.shop)}</small><h1>${title}</h1></div><div style="display:flex;gap:6px;align-items:center">
  <div class="pill" id="syncb" style="display:none;background:#fff3d6;color:#8a5a00"></div>
  <div class="pill">${ic(me.role==="owner"?"crown-bold":"user-bold",16)}${me.role==="owner"?"Egasi":"Admin"}</div></div></div>`;
}

/* ---------- SKANER ---------- */
async function startScan(box, rid, cb){
  await stopScan();
  $("#" + box).classList.add("on");
  const F = Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode(rid, {verbose:false, experimentalFeatures:{useBarCodeDetectorIfSupported:true},
    formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39]});
  scanner.start({facingMode:"environment"}, {fps:25, disableFlip:true,
    qrbox:(w, h) => ({width:Math.floor(w * .9), height:Math.floor(Math.min(h * .5, 170))}),
    videoConstraints:{facingMode:"environment", width:{ideal:1280}, height:{ideal:720}}}, cb, () => {})
  .catch(() => { toast("Kameraga ruxsat bering", "danger-triangle-bold"); scanner = null; $("#" + box)?.classList.remove("on"); });
}
async function stopScan(){
  if(scanner){ try{ await scanner.stop(); }catch(e){} scanner = null; }
  document.querySelectorAll(".scan").forEach(e => e.classList.remove("on"));
}
const fresh = c => { const n = Date.now(); if(c === last.c && n - last.t < 2500) return false; last = {c, t:n}; feedback(); return true; };
const toggleScan = () => scanner ? stopScan() : startScan("scanbox", "reader", c => fresh(c) && onCode(c));

/* ---------- NOMNI AVTOMATIK TOPISH ---------- */
async function online(code){
  const one = async host => {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4500);
    const r = await fetch(`https://${host}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity`, {signal:ctl.signal});
    const j = await r.json(), p = j.product, n = p && (p.product_name || "").trim();
    if(j.status !== 1 || !n) throw 0;
    return [p.brands && p.brands.split(",")[0], n, p.quantity].filter(Boolean).join(" ");
  };
  try{ return await Promise.any(["world.openfoodfacts.org","world.openproductsfacts.org","world.openbeautyfacts.org"].map(one)); }
  catch(e){ return ""; }
}
async function find(code){
  let p = P.get(code); if(p) return p;
  try{
    const {data} = await T(sb.from("products").select("*").eq("barcode", code).maybeSingle(), 5000);
    if(data){ P.set(code, data); return data; }
  }catch(e){}
  toast("Qidirilmoqda...", "magnifer-linear");
  return {...blank(), barcode:code, name:await online(code)};
}
async function onCode(code){
  if(!code || $("#modal")) return;
  const p = await find(code);
  if(p.isNew){ if($("#modal")) return; openForm(p, true); if(p.name) toast("Topildi: " + p.name); }
  else { addCart(p); toast(p.name); }
}

/* ---------- SOTUV ---------- */
function sellView(){
  $("#view").innerHTML = head("Sotuv") + `<div class="scan" id="scanbox"><div id="reader"></div>${CORNERS}</div>
  <label class="field">${ic("magnifer-linear",20)}<input id="manual" autocomplete="off" placeholder="Nomi yoki shtrix-kod (skaner shu yerga yozadi)" oninput="sq()" onkeydown="if(event.key==='Enter')manualAdd()"></label>
  <div id="sres"></div><div id="cart"></div>`;
  drawCart();
  if(S.auto) setTimeout(toggleScan, 300);
  if(FINE) $("#manual").focus();
}
function sq(){
  const q = $("#manual").value.trim().toLowerCase();
  const r = q ? [...P.values()].filter(p => p.name.toLowerCase().includes(q) || p.barcode.includes(q)).slice(0, 6) : [];
  $("#sres").innerHTML = r.map(p => `<div class="card" onclick="pick('${encodeURIComponent(p.barcode)}')"><div class="ico">${ic("box-bold-duotone",24)}</div>
  <div class="grow"><b>${esc(p.name)}</b><small>${esc(p.barcode)}</small></div><b class="right blue">${money(p.price)}</b></div>`).join("");
}
function pick(b){ addCart(P.get(decodeURIComponent(b))); $("#manual").value = ""; $("#sres").innerHTML = ""; }
function manualAdd(){
  const v = $("#manual").value.trim(); if(!v) return;
  if(P.has(v)) return pick(encodeURIComponent(v));
  const first = $("#sres").firstElementChild;
  if(first) return first.click();
  if(/^[0-9A-Za-z\-]{6,}$/.test(v)){ $("#manual").value = ""; onCode(v); }
}
function drawCart(){
  const total = cart.reduce((s, c) => s + c.qty * c.price, 0);
  $("#cart").innerHTML = cart.length ? `<h2>Savat: ${cart.length} xil <button class="btn red sm" onclick="cart=[];drawCart()">${ic("trash-bin-trash-bold",18)} Tozalash</button></h2>` +
    cart.map((c, i) => `<div class="card"><div class="ico">${ic("box-bold-duotone",24)}</div>
    <div class="grow"><b>${esc(c.name)}</b><small class="blue" style="font-weight:700">${money(c.price)} / ${esc(c.unit)}</small></div>
    <div class="qty"><button onclick="qty(${i},-1)">${ic("minus-circle-bold",28)}</button><b onclick="setQty(${i})">${c.qty}</b><button onclick="qty(${i},1)">${ic("add-circle-bold",28)}</button></div></div>`).join("")
    : `<div class="empty">${ic("cart-large-2-bold-duotone",54)}<div>Savat bo'sh</div><small>Skanerlang yoki nomini qidiring</small></div>`;
  let s = $("#slab");
  if(!s){ s = document.createElement("div"); s.id = "slab"; s.className = "slab"; document.body.appendChild(s); }
  s.innerHTML = `<div class="srow"><span class="mute">Jami</span><b>${money(total)}</b></div>
  <div class="row"><button class="btn" onclick="toggleScan()">${ic("scanner-bold",22)} Skaner</button>
  <button class="btn b" ${cart.length ? "" : "disabled"} onclick="sell()">Sotish ${ic("alt-arrow-right-bold",20)}</button></div>`;
}
function qty(i, d){
  const c = cart[i]; c.qty = Math.round((c.qty + d) * 1000) / 1000;
  if(c.qty <= 0) cart.splice(i, 1);
  else if(c.qty > c.stock) toast("Omborda faqat " + c.stock + " " + c.unit, "danger-triangle-bold");
  drawCart();
}
function setQty(i){
  const v = parseFloat(String(prompt("Miqdor (masalan 0.5):", cart[i].qty) || "").replace(",", "."));
  if(v > 0){ cart[i].qty = v; drawCart(); }
}
function addCart(p){
  const c = cart.find(x => x.barcode === p.barcode);
  c ? c.qty++ : cart.push({...p, qty:1});
  if(tab === "sell") drawCart();
}
function sell(){
  if(!cart.length) return;
  if(cart.some(c => c.price <= 0)) return toast("Narxi 0 bo'lgan mahsulot bor", "danger-triangle-bold");
  const items = cart.map(c => ({barcode:c.barcode, name:c.name, qty:c.qty, price:c.price}));
  const total = items.reduce((a, i) => a + i.qty * i.price, 0);
  const s = {id:uid(), at:new Date().toISOString(), items};
  Q.push(s); saveQ();
  items.forEach(i => { const p = P.get(i.barcode); if(p) p.stock -= i.qty; }); cacheP();
  cart = []; drawCart(); toast("Sotildi: " + money(total));
  if(S.print) printReceipt({code:code6(s.id), at:s.at, items, total});
  updBadge(); flush();
}

  $("#view").innerHTML = head("Cheklar") + `<div class="chips">${[["today","Bugun"],["yest","Kecha"],["week","7 kun"]].map(([k, l]) => `<button class="chip ${rf===k?"on":""}" onclick="rf='${k}';receiptsView()">${l}</button>`).join("")}</div><div id="rlist" class="empty">Yuklanmoqda...</div>`;

    ${cn(s) ? '<span class="tag low">Bekor</span>' : s.local ? '<span class="tag" style="background:#fff3d6;color:#8a5a00">Kutmoqda</span>' : ""}</div>`).join("")
    : `<div class="empty">${ic("bill-list-bold-duotone",54)}<div>Chek yo'q</div></div>`);
}
async function openReceipt(i){
  const s = window._rec[i]; closeForm();
  let items = [];
  if(s.local) items = (Q.find(x => x.id === s.id) || {}).items || [];
  else{
    try{ const {data} = await T(sb.from("sale_items").select("*").eq("sale_id", s.id)); items = data || []; }
    catch(e){ return toast("Internet yo'q", "danger-triangle-bold"); }
  }
  cur = {...s, items, code:code6(s.client_id || s.id), at:s.created_at};
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div><h1 style="font-size:24px">${money(s.total)}</h1><small style="margin-bottom:10px">${fmtT(s.created_at)} · Chek ${cur.code}${s.status === "canceled" ? " · BEKOR QILINGAN" : ""}</small>
  ${items.map(x => `<div class="line"><span>${esc(x.name)}<small>${x.qty} × ${money(x.price)}</small></span><b>${money(x.qty * x.price)}</b></div>`).join("")}

  <button class="btn auto" onclick="closeForm()">${ic("close-circle-linear",22)}</button></div></div>`;

}
async function cancelReceipt(){
  if(!confirm("Chek bekor qilinsinmi? Mahsulotlar omborga qaytadi.")) return;
  const s = cur;
  if(s.local){
    const x = Q.find(q => q.id === s.id);
    if(x){ x.items.forEach(i => { const p = P.get(i.barcode); if(p) p.stock += i.qty; }); Q = Q.filter(q => q.id !== s.id); saveQ(); cacheP(); }
    closeForm(); updBadge(); return receiptsView();
  }
  try{ const {error} = await T(sb.rpc("cancel_sale", {p_id:s.id})); if(error) throw error; }
  catch(e){ return toast("Xato: " + (e.message || "internet yo'q"), "danger-triangle-bold"); }
  closeForm(); toast("Chek bekor qilindi"); await loadP(); receiptsView();
}

let kb = "", kt = 0;
addEventListener("keydown", e => {
  if(!me || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || $("#modal")) return;
  const n = Date.now(); if(n - kt > 120) kb = ""; kt = n;
  if(e.key === "Enter"){
    const c = kb; kb = "";
    if(c.length >= 4){
      feedback();
      if(tab === "sell") onCode(c); else if(tab === "products"){ $("#q").value = c; drawProducts(); }
    }
  }else if(e.key.length === 1) kb += e.key;
});
document.addEventListener("click", () => {
  if(FINE && tab === "sell" && !$("#modal") && !/INPUT|SELECT/.test(document.activeElement.tagName)) setTimeout(() => $("#manual")?.focus(), 60);
});
document.addEventListener("visibilitychange", () => { if(!document.hidden){ wl(); flush(); } });
addEventListener("online", flush); setInterval(flush, 20000);
addEventListener("unhandledrejection", e => { e.preventDefault(); console.warn(e.reason); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

init();
</script>
</body>
</html>
