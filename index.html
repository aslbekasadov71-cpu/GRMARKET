<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{font:500 16px/1.4 Manrope,-apple-system,system-ui,sans-serif;color:var(--ink);padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding:10px 14px calc(250px + env(safe-area-inset-bottom))}
iconify-icon{display:inline-block;vertical-align:middle;flex:none}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:14px;font-weight:700;margin:20px 0 8px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.mute{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px}

input,select{font:inherit;color:inherit;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;outline:0}
input:focus,select:focus{border-color:var(--b)}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
.field:focus-within{border-color:var(--b)}

.field iconify-icon{color:var(--b)}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.b{background:var(--b);color:#fff;border-color:var(--b)}
.btn.b:disabled{opacity:.45}
.btn.red{background:var(--redl);color:var(--red);border-color:var(--redl)}
.btn.full{width:100%}.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--b);font:inherit;font-weight:700;padding:10px;cursor:pointer;width:100%;text-align:center}

.fimg .ico{width:64px;height:64px;border-radius:14px}
.blue{color:var(--b)}
.right{text-align:right;flex:none}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bl);color:var(--b);display:inline-block}
.tag.low{background:var(--redl);color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{font:inherit;font-weight:700;font-size:14px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px}

.bl{bottom:12px;left:12px;border-right:0!important;border-top:0!important;border-radius:0 0 0 12px}
.br{bottom:12px;right:12px;border-left:0!important;border-top:0!important;border-radius:0 0 12px 0}

.dblk{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}

.heard{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-style:italic}
.heard small{font-style:normal;margin-bottom:2px}
.amt{margin:-6px 0 10px 4px;font-weight:700;color:var(--b)}
.microw{display:flex;align-items:center;gap:14px;-webkit-user-select:none;user-select:none}
.microw b{display:block}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--b);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
.mic.rec{background:var(--red);transform:scale(1.12);animation:pulse 1.1s infinite}
.mic.busy{opacity:.55}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(240,68,56,.22)}50%{box-shadow:0 0 0 16px rgba(240,68,56,.06)}}
.ini{font-weight:800;font-size:18px}
.mgrp{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;overflow:hidden}
.mhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mhead .grow{min-width:0}.mhead b{display:block}
.mimg{width:76px;height:76px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--b);position:relative;cursor:zoom-in}
.mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.mstat{display:flex;gap:6px;margin-bottom:4px}
.mstat div{flex:1;background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
.mstat small{font-size:12px}.mstat b{font-size:15px;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mrow.me{background:var(--bl);margin:0 -14px;padding:10px 14px}
.mrow .grow{flex:1;min-width:0}.mrow b{display:block}
.cheap{color:#16a34a}.dear{color:var(--red)}
.bigimg{width:100%;max-height:70vh;object-fit:contain;background:#fff;border-radius:18px;margin-bottom:12px}
.rank{width:28px;height:28px;border-radius:9px;background:var(--bl);color:var(--b);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.pbar{height:6px;border-radius:99px;background:var(--bl);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--b);border-radius:99px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
@media(min-width:900px){#app{max-width:860px}.slab{max-width:860px}}
@page{margin:0}
@media print{html,body{background:#fff!important}body>*:not(#rcpt){display:none!important}
#rcpt{display:block;font:12px/1.35 "Courier New",monospace;color:#000;padding:2mm}
#rcpt .r{display:flex;justify-content:space-between;gap:6px}#rcpt hr{border:0;border-top:1px dashed #000;margin:4px 0}#rcpt .c{text-align:center}}
</style>

// ====================================================

let RECOVERY = /type=recovery/.test(location.hash); // parolni tiklash havolasidan kelgan
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, s = 22) => `<iconify-icon icon="solar:${n}" width="${s}" height="${s}"></iconify-icon>`;

try{ S = {...DEF, ...JSON.parse(localStorage.getItem("dk") || "{}")}; }catch(e){}

const CORNERS = '<i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>';

  const t = $("#toast"); t.innerHTML = ic(icon, 20) + esc(m); t.style.display = "flex";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600);

function feedback(){
  if(S.vib && navigator.vibrate) navigator.vibrate(50);
  if(!S.beep) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();

    o.connect(g); g.connect(ac.destination); o.frequency.value = 1100; g.gain.value = .15;
    o.start(); o.stop(ac.currentTime + .08);
  }catch(e){}
}
async function loadP(){
  const m = new Map();
  try{
    for(let f = 0; ; f += 1000){
      const {data, error} = await T(sb.from("products").select("*").order("barcode").range(f, f + 999), 12000);
      if(error) throw error;
      (data || []).forEach(p => m.set(p.barcode, p));
      if(!data || data.length < 1000) break;

  }catch(e){
    if(!P.size){ try{ JSON.parse(localStorage.getItem("dp") || "[]").forEach(p => m.set(p.barcode, p)); P = m; }catch(x){} }
  }
}

  let prof = null, info = null, offline = false;

    try{
      const r = await T(sb.rpc("ensure_profile"), 8000);
      if(r.error){

        const s = await T(sb.rpc("shop_info"), 8000);

  if(me.role === "pending") return pendingView();

let flushing = false;
async function flush(){
  if(flushing || !Q.length || !ready()) return;
  flushing = true; let sent = false;
  try{
    while(Q.length){
      const s = Q[0];
      const {error} = await T(sb.rpc("make_sale", {p_client:s.id, p_items:s.items, p_at:s.at}), 10000);
      if(error){
        const code = error.code || "";
        const expired = /Obuna/i.test(error.message || "");
        if(!expired && (code === "P0001" || /^2[23]/.test(code))){
          // server chekni rad etdi (qayta urinish foydasiz): alohida saqlaymiz, navbat to'xtab qolmasin
          Qf.push({...s, err:error.message}); saveQf(); Q.shift(); saveQ(); updBadge();
          toast("Chek qabul qilinmadi: " + error.message, "danger-triangle-bold");
          continue;
        }
        if(expired) await refreshShop();
        if(!flush.w){ flush.w = 1; setTimeout(() => flush.w = 0, 60000); toast(expired ? "Obuna tugagan: cheklar saqlanyapti" : "Sinxronlash kutilmoqda", "danger-triangle-bold"); }
        break;
      }
      Q.shift(); saveQ(); sent = true; updBadge();
    }
  }catch(e){}
  flushing = false; updBadge();
  if(sent && !Q.length) loadP();
}
function retryFailed(){
  if(!Qf.length) return;
  Q.push(...Qf.map(({err, ...s}) => s)); Qf = []; saveQ(); saveQf(); updBadge(); flush();
  toast("Qayta yuborilmoqda"); setView();
}

async function lookup(code){
  const one = async host => {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4500);
    const r = await fetch(`https://${host}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity,image_front_small_url,image_small_url,image_front_url,image_url`, {signal:ctl.signal});
    const j = await r.json(), p = j.product, n = p && (p.product_name || "").trim();
    const img = p ? (p.image_front_small_url || p.image_small_url || p.image_front_url || p.image_url || "") : "";
    if(j.status !== 1 || (!n && !img)) throw 0;
    const br = p && p.brands ? p.brands.split(",")[0].trim() : "", qt = p && p.quantity ? String(p.quantity).trim() : "";
    return {name: n ? [br && !n.toLowerCase().includes(br.toLowerCase()) ? br : "", n, qt && !n.toLowerCase().includes(qt.toLowerCase()) ? qt : ""].filter(Boolean).join(" ") : "", image: /^https:\/\//.test(img) ? img : ""};
  };
  try{ return await Promise.any(["world.openfoodfacts.org","world.openproductsfacts.org","world.openbeautyfacts.org"].map(one)); }
  catch(e){ return {name:"", image:""}; }
}

function editW(i){ openWeight(cart[i]); }
function wShow(skip){
  const p = wt.p, q = wt.q || 0;

  if(skip !== "qty") $("#w_qty").value = q ? (wt.g ? Math.round(q * 1000) : Math.round(q * 1000) / 1000) : "";
  $("#w_qty").placeholder = (wt.g ? "Miqdor (" + wt.small + ")" : "Miqdor (" + wt.big + ")");
  $("#w_unit").innerHTML = [[false, wt.big], [true, wt.small]].map(([g, l]) => `<button class="chip ${wt.g === g ? "on" : ""}" onclick="wUnit(${g})">${l}</button>`).join("");
  const over = p.stock > 0 && q > p.stock;
  $("#w_prev").className = "marg" + (over ? " neg" : q ? " pos" : "");
  $("#w_prev").innerHTML = q ? `<span class="mute">Jami</span><div style="text-align:right"><b>${money(lt(q, p.price))}</b><small>${fq(q)} ${wt.big}${over ? " · omborda faqat " + p.stock : ""}</small></div>` : `<span class="mute">Summa yoki miqdorni yozing</span>`;

function wFromSum(){ const v = +$("#w_sum").value || 0; wt.q = wt.p.price > 0 ? r6(v / wt.p.price) : 0; wShow("sum"); }
function wFromQty(){ const v = +$("#w_qty").value || 0; wt.q = r6(wt.g ? v / 1000 : v); wShow("qty"); }

function wSetSum(v){ wt.q = wt.p.price > 0 ? r6(v / wt.p.price) : 0; wShow(); }
function wOk(){
  if(!(wt.q > 0)) return toast("Summa yoki miqdorni yozing", "danger-triangle-bold");

  i >= 0 ? cart[i].qty = wt.q : cart.push({...wt.p, qty:wt.q});

function addCart(p){

async function sell(){
  if(!cart.length) return;

function pickImg(inp){
  const f = inp.files && inp.files[0]; if(!f) return;

  im.onload = () => {
    const S = 220, k = Math.min(1, S / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); setImg(c.toDataURL("image/jpeg", .72));

const ALIAS = {
  barcode:["shtrix-kod","shtrixkod","shtrix kod","shtrix","barcode","kod","штрихкод","штрих-код","штрих код"],
  name:["nomi","nom","nomlanishi","name","mahsulot","mahsulot nomi","наименование","название","товар"],
  price:["narxi","narx","price","sotuv narxi","цена"],
  stock:["qoldiq","qoldig'i","soni","miqdor","stock","qty","остаток","количество"],
  unit:["birlik","o'lchov","unit","ед","ед.","единица"],
  cost:["kelish narxi","kelish","tannarx","kelish_narxi","cost","закупка","закупочная цена","себестоимость"]
};
const mapHeader = h => { const k = String(h).trim().toLowerCase().replace(/[’`ʻ‘]/g, "'"); for(const f in ALIAS) if(ALIAS[f].includes(k)) return f; return null; };
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/, 1)[0] || "";
  const cnt = c => first.split(c).length - 1;
  const d = cnt(";") >= cnt(",") && cnt(";") >= cnt("\t") ? ";" : cnt("\t") > cnt(",") ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === d){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c !== "\r") cell += c;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
const num = v => { const n = parseFloat(String(v ?? "").replace(/[\s ]/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
async function importFile(inp){
  const f = inp.files[0]; inp.value = ""; if(!f) return;
  const rows = parseCSV(await f.text());
  if(!rows.length) return toast("Fayl bo'sh", "danger-triangle-bold");
  let idx = {}, start = 0;
  rows[0].forEach((h, i) => { const k = mapHeader(h); if(k && !(k in idx)) idx[k] = i; });
  if("barcode" in idx) start = 1; else idx = {barcode:0, name:1, price:2, stock:3, unit:4};
  const map = new Map(); let bad = 0, noname = 0;
  for(const r of rows.slice(start)){
    let code = String(r[idx.barcode] ?? "").trim().replace(/\.0+$/, "");
    if(!code || /e\+/i.test(code)){ bad++; continue; }
    let name = String(r[idx.name] ?? "").trim();
    if(!name){ name = "Nomsiz " + code.slice(-4); noname++; }
    let unit = String(r[idx.unit] ?? "").trim().toLowerCase();
    const row = {barcode:code, name, price:Math.max(0, num(r[idx.price])), stock:num(r[idx.stock]), unit:unit || "dona"};
    if("cost" in idx){ const cv = String(r[idx.cost] ?? "").trim(); row.cost = cv === "" ? (P.get(code)?.cost || 0) : Math.max(0, num(cv)); }
    map.set(code, row);
  }
  const list = [...map.values()];
  if(!list.length) return toast("Mahsulot topilmadi. Birinchi qatorda sarlavha bo'lishi kerak", "danger-triangle-bold");
  window._imp = list;
  const upd = list.filter(p => P.has(p.barcode)).length;
  closeForm();
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div><h1 style="font-size:22px;margin-bottom:10px">Yuklashni tasdiqlang</h1>
  <div class="card"><div class="ico">${ic("box-bold-duotone",24)}</div><div class="grow"><b>${list.length} ta mahsulot</b><small>${list.length - upd} ta yangi · ${upd} ta yangilanadi (narx va qoldiq almashadi)</small></div></div>
  ${bad || noname ? `<small style="margin-bottom:8px">${bad ? bad + " ta qator o'tkazib yuborildi (shtrix-kod yo'q yoki buzilgan). " : ""}${noname ? noname + " ta mahsulot nomsiz." : ""}</small>` : ""}
  ${list.slice(0, 3).map(p => `<div class="line"><span>${esc(p.name)}<small>${esc(p.barcode)}</small></span><b>${money(p.price)} · ${p.stock}</b></div>`).join("")}
  <div class="row" style="margin-top:16px"><button class="btn b" id="impgo" onclick="runImport()">Yuklash</button><button class="btn" onclick="closeForm()">Bekor</button></div></div>`;
  m.addEventListener("click", e => { if(e.target === m) closeForm(); });
  document.body.appendChild(m);
}

  }
}
function people(){
  const m = new Map();
  for(const r of D){
    const k = r.dir + "|" + nkey(r.person);
    let p = m.get(k);
    if(!p){ p = {name:r.person, dir:r.dir, phone:"", bal:0, last:r.created_at, rows:[]}; m.set(k, p); }
    p.bal += (r.kind === "pay" ? -1 : 1) * +r.amount;
    if(!p.phone && r.phone) p.phone = r.phone;
    if(r.created_at > p.last) p.last = r.created_at;
    p.rows.push(r);
  }
  return [...m.values()];
}

function drawDebts(err = ""){

  const L = $("#dlist"); L.className = "";
  L.innerHTML = (err ? `<small style="margin-bottom:8px">${esc(err)}</small>` : "") + (dShown.length ? dShown.map((p, i) => `<div class="card" onclick="openDebt(${i})">

/* Ovoz: Telegramdagidek bosib turib gapiriladi, qo'yib yuborilganda matnga aylanadi */
// Ovoz to'g'ridan-to'g'ri mikrofondan PCM ko'rinishida olinadi (iPhone'da ham qotmaydi), keyin 16 kHz WAV qilinadi
let mCtx = null, mSrc = null, mProc = null, mPcm = [], mRate = 48000, mOn = false, mStream = null, mT0 = 0, mUp = true, mTimer = null, mBusy = false;
function micBar(){
  const s = document.createElement("div"); s.id = "slab"; s.className = "slab";
  s.innerHTML = `<div class="microw"><button id="mic" class="mic" aria-label="Ovozli kiritish" onpointerdown="recStart(event)" onpointerup="recStop()" onpointercancel="recStop()" oncontextmenu="return false">${ic("microphone-3-bold",30)}</button>
  <div class="grow"><b id="mlab">Bosib turing va gapiring</b><small id="msub">Masalan: «Alisher 85 ming so'mlik nasiya oldi»</small></div></div>`;
  document.body.appendChild(s);
}
function micUI(st = ""){
  const b = $("#mic"); if(!b) return;
  b.className = "mic" + (st ? " " + st : "");
  $("#mlab").textContent = st === "rec" ? "0:00 · Qo'yib yuboring" : st === "busy" ? "Tushunilmoqda..." : "Bosib turing va gapiring";
  $("#msub").textContent = st === "rec" ? "Ism, summa va kim kimga qarz ekanini ayting" : st === "busy" ? "Bir necha soniya" : "Masalan: «Alisher 85 ming so'mlik nasiya oldi»";
}
const stopStream = () => {
  try{ if(mProc){ mProc.onaudioprocess = null; mProc.disconnect(); } }catch(e){}
  try{ if(mSrc) mSrc.disconnect(); }catch(e){}
  try{ mStream?.getTracks().forEach(t => t.stop()); }catch(e){}
  mProc = mSrc = mStream = null; mOn = false;
};
async function recStart(e){
  e.preventDefault();
  if(mBusy || mOn || mStream) return;
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(x){}
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!navigator.mediaDevices?.getUserMedia || !AC) return toast("Bu qurilmada ovoz yozib bo'lmaydi", "danger-triangle-bold");
  try{ if(!mCtx || mCtx.state === "closed") mCtx = new AC(); mCtx.resume(); }catch(x){ return toast("Ovoz yozib bo'lmadi", "danger-triangle-bold"); }
  mUp = false;
  let st;
  try{ st = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); }
  catch(x){ mUp = true; return toast("Mikrofonga ruxsat bering", "danger-triangle-bold"); }
  mStream = st;
  if(mUp){ stopStream(); return toast("Ruxsat berildi. Endi bosib turib gapiring", "microphone-3-bold"); }
  try{
    await T(mCtx.resume(), 2000).catch(() => {});
    mRate = mCtx.sampleRate; mPcm = [];
    mSrc = mCtx.createMediaStreamSource(st);
    mProc = mCtx.createScriptProcessor(4096, 1, 1);
    mProc.onaudioprocess = ev => { if(mOn) mPcm.push(new Float32Array(ev.inputBuffer.getChannelData(0))); };
    mSrc.connect(mProc); mProc.connect(mCtx.destination);
  }catch(x){ stopStream(); return toast("Ovoz yozib bo'lmadi", "danger-triangle-bold"); }
  mOn = true; mT0 = Date.now(); micUI("rec");
  if(mUp) return recStop();
  if(navigator.vibrate) navigator.vibrate(30);
  mTimer = setInterval(() => {
    const s = Math.floor((Date.now() - mT0) / 1000), l = $("#mlab");
    if(l) l.textContent = `0:${String(s).padStart(2, "0")} · Qo'yib yuboring`;
    if(s >= 59) recStop();
  }, 250);
}
function recStop(){
  mUp = true;
  if(!mOn) return;
  clearInterval(mTimer);
  const dur = Date.now() - mT0;
  setTimeout(() => {            // oxirgi bo'lak ham yozilib ulgurishi uchun
    const pcm = mPcm, rate = mRate; mPcm = [];
    stopStream(); micUI();
    if(dur < 800 || !pcm.length) return toast(pcm.length ? "Tugmani bosib turib gapiring" : "Mikrofondan ovoz kelmadi, qayta urinib ko'ring", "microphone-3-bold");
    sendVoice(pcm, rate);
  }, 200);
}
function recCancel(){ mUp = true; clearInterval(mTimer); if(mOn || mStream){ mPcm = []; stopStream(); } }
function ab64(buf){
  const u = new Uint8Array(buf); let s = "";
  for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function toWav(chunks, rate){   // 16 kHz mono WAV (yengil va Gemini uchun qulay)
  const R = 16000, len = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(len);
  let o = 0; for(const c of chunks){ all.set(c, o); o += c.length; }
  const k = rate / R, n = Math.floor(len / k), out = new Float32Array(n);
  for(let i = 0; i < n; i++){            // o'rtacha olib chastotani pasaytirish
    const a = Math.floor(i * k), b = Math.min(len, Math.floor((i + 1) * k)); let s = 0;
    for(let j = a; j < b; j++) s += all[j];
    out[i] = b > a ? s / (b - a) : (all[a] || 0);
  }
  let peak = 0; for(let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(out[i]));
  const g = peak > 0.01 && peak < 0.5 ? 0.9 / peak : 1;   // past ovozni kuchaytirish
  const v = new DataView(new ArrayBuffer(44 + n * 2)), w = (p, s) => { for(let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, R, true); v.setUint32(28, R * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  for(let i = 0; i < n; i++){ const x = Math.max(-1, Math.min(1, out[i] * g)); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return {audio:ab64(v.buffer), peak};
}
async function sendVoice(pcm, rate){
  mBusy = true; micUI("busy");
  try{
    const {audio, peak} = toWav(pcm, rate), mime = "audio/wav";
    if(peak < 0.003) throw new Error("Ovoz eshitilmadi: mikrofon juda past yoki yopiq");
    const names = [...new Set(D.map(d => d.person))].slice(0, 300);
    const {data, error} = await T(sb.functions.invoke("qarz-ovoz", {body:{audio, mime, people:names}}), 45000);
    if(error){
      let st = 0, body = "";
      try{ st = error.context?.status || 0; body = await error.context?.text(); }catch(x){}
      try{ const j = JSON.parse(body); body = j.error || j.msg || j.message || body; }catch(x){}
      throw new Error(st === 404 ? "qarz-ovoz funksiyasi topilmadi (nomini tekshiring)" : st === 401 ? "401: funksiyada «Verify JWT» ni o'chiring" : (st ? st + ": " : "") + (body || error.message));
    }
    if(data?.error) throw new Error(data.error);
    const items = (data?.items || []).filter(x => x && (x.person || x.amount));
    if(!items.length && !data?.transcript) toast("Ovoz tushunilmadi, qaytadan ayting", "danger-triangle-bold");
    else{
      if(!items.length) toast("Ism yoki summani qo'lda kiriting", "danger-triangle-bold");
      debtForm(items, data.transcript || "");
    }
  }catch(e){
    const m = String(e?.message || "");
    const t = $("#toast");
    toast(/timeout/.test(m) ? "Javob kelmadi, internetni tekshiring" : /Failed to send/i.test(m) ? "Funksiyaga ulanib bo'lmadi (qarz-ovoz)" : "Xato: " + m.slice(0, 160), "danger-triangle-bold");
    clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 8000);
  }
  mBusy = false; micUI();
}

      const l = await lookup(t.barcode); t.name = l.name; if(!t.image) t.image = l.image;
      if($("#inname") && t.name) $("#inname").textContent = t.name;
      if($("#inimg") && t.image) $("#inimg").innerHTML = `<img src="${esc(t.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;
    }
    const d = await fnCall("narx-internet", {name:t.name, barcode:t.barcode}, 30000);
    inetCache.set(t.q, d);
    if(inetT === t) drawInet(d);
  }catch(e){
    if(inetT === t && $("#inetr")){
      $("#inetr").innerHTML = `<small style="margin-top:10px;color:var(--red);font-weight:700">${esc(/timeout/.test(e.message) ? "Javob kelmadi, ↻ tugmasi bilan qayta urinib ko'ring" : e.message)}</small>`;
      if($("#instat")) $("#instat").textContent = "Topilmadi";
    }
  }
}
const STORE_COLOR = {"Yandex Lavka":"#fc3f1d", "Uzum Market":"#7000ff", "Makro":"#e30613"};
function drawInet(d){
  const R = $("#inetr"); if(!R) return;
  const unit = x => x.each || x.price;
  const it = (d.items || []).slice().sort((a, b) => (b.score >= .75) - (a.score >= .75) || unit(a) - unit(b)), mine = inetT && inetT.mine;
  if($("#inname") && d.query && !inetT.name) $("#inname").textContent = d.query;
  const src = Object.entries(d.sources || {}).map(([k, v]) => `${esc(k)} ${v === "ok" ? "✓" : "✗"}`).join(" · ");
  if(!it.length){
    if($("#instat")) $("#instat").textContent = "Topilmadi";
    R.innerHTML = `<small style="margin-top:10px">«${esc(d.query || inetT.q)}» internet-do'konlarda topilmadi. Nomini qisqaroq yozib ko'ring (masalan: «Snickers»).</small>${src ? `<small style="margin-top:6px">Tekshirildi: ${src}</small>` : ""}`;
    return;
  }
  const pr = it.map(unit), lo = Math.min(...pr), hi = Math.max(...pr), nStores = new Set(it.map(x => x.store)).size;
  if($("#instat")) $("#instat").textContent = `${nStores} ta do'kon · ${it.length} ta taklif`;
  if($("#inimg") && !inetT.image){ const im = it.find(x => x.image); if(im) $("#inimg").innerHTML = `<img src="${esc(im.image)}" alt="" referrerpolicy="no-referrer">`; }
  R.innerHTML = `<div class="mstat"><div><small>Eng arzon</small><b class="cheap">${money(lo)}</b></div>${it.length > 1 ? `<div><small>Eng qimmat</small><b class="dear">${money(hi)}</b></div>` : ""}${mine ? `<div><small>Sizda</small><b>${money(mine)}</b></div>` : ""}</div>
    ${it.map(x => `<a class="mrow" style="text-decoration:none;color:inherit;align-items:flex-start" href="${esc(x.url)}" target="_blank" rel="noopener">
      <div class="mimg" style="width:58px;height:58px;cursor:pointer">${ic("box-bold-duotone",24)}${x.image ? `<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</div>
      <div class="grow"><b style="color:${STORE_COLOR[x.store] || "var(--ink)"}">${esc(x.store)}</b>
        <small style="color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(x.title)}</small>
        ${x.note ? `<small>${esc(x.note)}</small>` : ""}${x.score >= 0.75 ? '<small class="cheap" style="font-weight:700">aniq mos</small>' : ""}</div>
      <div class="right"><b class="${unit(x) === lo && it.length > 1 ? "cheap" : ""}">${money(x.price)}</b>${x.old > x.price ? `<small style="text-decoration:line-through">${money(x.old)}</small>` : ""}${x.each ? `<small>1 donasi ≈ ${money(x.each)}</small>` : ""}</div></a>`).join("")}
    <small style="margin-top:8px">Narxlar do'konlarning o'z saytlaridan hozir olindi${src ? ` (${src})` : ""}. Bosib, saytda ochishingiz mumkin.</small>`;
}

function drawGroup(g, gi){
  const cnt = {}; g.forEach(r => cnt[r.name] = (cnt[r.name] || 0) + 1);
  const img = (g.find(r => r.image) || {}).image || "", name = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0], prices = g.map(r => +r.price);
  const lo = Math.min(...prices), hi = Math.max(...prices), avg = prices.reduce((a, b) => a + b, 0) / prices.length;
  const mine = g.find(r => r.mine), shops = new Set(g.map(r => r.shop_id)).size;
  const diff = mine && g.length > 1 ? Math.round((mine.price - avg) / avg * 100) : null;
  return `<div class="mgrp"><div class="mhead">
    <div class="mimg" ${img ? `onclick="bigImg(${gi})"` : ""}>${ic("box-bold-duotone",30)}${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</div>
    <div class="grow"><b>${esc(name)}</b><small>${esc(g[0].barcode)}</small><small>${shops} ta do'konda${g[0].unit ? " · " + esc(g[0].unit) : ""}</small></div></div>
    ${g.length > 1 ? `<div class="mstat"><div><small>Eng arzon</small><b class="cheap">${money(lo)}</b></div><div><small>O'rtacha</small><b>${money(avg)}</b></div><div><small>Eng qimmat</small><b class="dear">${money(hi)}</b></div></div>` : ""}
    ${diff !== null ? `<small style="margin:6px 0 8px;font-weight:700;color:${diff > 0 ? "var(--red)" : diff < 0 ? "#16a34a" : "var(--mute)"}">Sizning narxingiz o'rtachadan ${diff === 0 ? "farq qilmaydi" : Math.abs(diff) + "% " + (diff > 0 ? "qimmat" : "arzon")}</small>` : ""}
    ${g.map(r => `<div class="mrow ${r.mine ? "me" : ""}"><div class="ico" style="width:38px;height:38px;border-radius:11px">${ic("shop-2-bold-duotone",20)}</div>
      <div class="grow"><b>${esc(r.shop_name || "Do'kon")}${r.mine ? ' <span class="tag">Siz</span>' : ""}</b><small>${r.address ? ic("map-point-linear",13) + " " + esc(r.address) : "Manzil kiritilmagan"}</small>
      ${r.name !== name ? `<small>${esc(r.name)}</small>` : ""}</div>
      <b class="right ${g.length > 1 && +r.price === lo ? "cheap" : ""}">${money(r.price)}</b></div>`).join("")}
  </div>`;
}
function bigImg(gi){
  const g = mGroups[gi]; if(!g) return; const img = (g.find(r => r.image) || {}).image; if(!img) return;
  closeForm();
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div><img class="bigimg" src="${esc(img)}" alt="" referrerpolicy="no-referrer"><b>${esc(g[0].name)}</b><small style="margin-bottom:12px">${esc(g[0].barcode)}</small><button class="btn full" onclick="closeForm()">Yopish</button></div>`;
  m.addEventListener("click", e => { if(e.target === m) closeForm(); });
  document.body.appendChild(m);
}

/* ---------- USB SKANER (klaviatura kabi), UZILISH, XATOLAR ---------- */
let kb = "", kt = 0;
addEventListener("keydown", e => {
  if(!ready() || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || $("#modal")) return;
  const n = Date.now(); if(n - kt > 120) kb = ""; kt = n;
  if(e.key === "Enter"){
    const c = kb; kb = "";
    if(c.length >= 4){
      feedback();
      if(tab === "sell") onCode(c); else if(tab === "products"){ $("#q").value = c; drawProducts(); }
      else if(tab === "market" && $("#mq")){ $("#mq").value = c; marketSearch(c); }
    }
  }else if(e.key.length === 1) kb += e.key;
});
document.addEventListener("click", () => {
  if(FINE && tab === "sell" && ready() && !$("#modal") && !/INPUT|SELECT/.test(document.activeElement.tagName)) setTimeout(() => $("#manual")?.focus(), 60);
});
document.addEventListener("visibilitychange", () => { if(!document.hidden){ wl(); flush(); refreshShop(); } });
addEventListener("online", () => { flush(); refreshShop(); }); setInterval(flush, 20000); setInterval(refreshShop, 600000);
sb.auth.onAuthStateChange(ev => { if(ev === "PASSWORD_RECOVERY"){ RECOVERY = true; recoveryView(); } });
addEventListener("unhandledrejection", e => { e.preventDefault(); console.warn(e.reason); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

init();
</script>
