name: Android APK

# GitHub'da: Actions -> "Android APK" -> "Run workflow" tugmasi bilan ishga tushadi.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://grmarket.onrender.com
  APP_ID: uz.grmarket.pos
  APP_NAME: "Do'kon POS"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor loyihasini yaratish
        run: |
          mkdir -p app/www app/assets
          cd app
          cat > package.json <<'EOF'
          { "name": "grmarket-android", "version": "1.0.0", "private": true }
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "server": { "url": "${SITE_URL}", "cleartext": false },
            "android": { "allowMixedContent": false }
          }
          EOF
          cat > www/index.html <<'EOF'
          <!doctype html><html lang="uz"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Do'kon POS</title></head>
          <body style="font-family:sans-serif;text-align:center;padding:40px;background:#f2f4f9">
          <h2>Internet aloqasi yo'q</h2><p>Internetni tekshirib, ilovani qayta oching.</p>
          </body></html>
          EOF
          cp ../icon-512.png assets/icon-only.png
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/app@latest
          npx cap add android

      - name: Kamera ruxsati, ikonka va versiya
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application#' $M
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#ffffff' --splashBackgroundColor '#f2f4f9' || echo "Ikonka generatsiyasi o'tkazib yuborildi"
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          npx cap sync android

      - name: APK yig'ish va imzolash
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret topilmadi. Settings -> Secrets -> Actions ga qo'shing."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release.jks --ks-key-alias grmarket \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$GITHUB_WORKSPACE/DokonPOS.apk" aligned.apk
          rm -f release.jks
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify "$GITHUB_WORKSPACE/DokonPOS.apk"

      - name: Release'ga APK qo'yish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Do'kon POS 1.0.${{ github.run_number }}
          files: DokonPOS.apk
